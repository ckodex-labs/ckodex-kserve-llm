name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]

# Least-privilege: read-only by default.
permissions:
  contents: read

jobs:
  ci:
    name: Lint + Test + Build + Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Dagger Pipeline
        uses: dagger/dagger-for-github-action@v6
        with:
          version: "0.20.2"
          verb: run
          args: go run ./ci/main.go
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 30

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: sbom
          path: sbom/
          retention-days: 90
