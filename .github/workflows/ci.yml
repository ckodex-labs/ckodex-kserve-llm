name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]

# Least-privilege: read-only by default.
permissions:
  contents: read

jobs:
  ci:
    name: Lint + Test + Build + Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Detect console sources
        id: console
        shell: bash
        run: |
          if [[ -f console/package.json && -f console/package-lock.json ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Console gate skipped::console/package.json and console/package-lock.json are not present in this checkout. The repo currently stores console as a gitlink without a .gitmodules mapping, so Actions cannot populate it from a fresh clone."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.console.outputs.available == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Install GoReleaser
        shell: bash
        run: |
          curl -sSL https://github.com/goreleaser/goreleaser/releases/download/v2.15.4/goreleaser_Linux_x86_64.tar.gz \
            | tar -xz goreleaser
          sudo mv goreleaser /usr/local/bin/goreleaser
          goreleaser --version

      - name: Install Dagger CLI
        shell: bash
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh \
            | BIN_DIR=/usr/local/bin DAGGER_VERSION=v0.21.4 sh
          dagger version

      - name: Build console
        if: steps.console.outputs.available == 'true'
        working-directory: console
        run: |
          npm ci
          npm run build

      - name: Generate Dagger SDK
        shell: bash
        run: dagger develop

      - name: Run CI Pipeline (lint + test + scan)
        shell: bash
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          DAGGER_NO_NAG: "1"
        run: |
          df -h
          docker system df || true
          set +e
          dagger --progress=plain call all --source=. 2>&1 | tee dagger-all.log
          status=${PIPESTATUS[0]}
          set -e
          df -h
          docker system df || true
          exit "$status"

      - name: Export coverage report
        shell: bash
        if: success()
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          DAGGER_NO_NAG: "1"
        run: dagger --progress=plain call coverage --source=. export --path=coverage.out

      - name: Rehearse release artifacts
        run: make release-readiness

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 30

      - name: Upload release snapshot artifacts
        uses: actions/upload-artifact@v4
        if: success()
        continue-on-error: true
        with:
          name: release-snapshot
          path: |
            dist/
            bin/release-readiness.json
          retention-days: 30
