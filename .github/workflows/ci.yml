name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]

# Least-privilege: read-only by default.
permissions:
  contents: read

jobs:
  ci:
    name: Lint + Test + Build + Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Detect console sources
        id: console
        shell: bash
        run: |
          if [[ -f console/package.json && -f console/package-lock.json ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Console gate skipped::console/package.json and console/package-lock.json are not present in this checkout. The repo currently stores console as a gitlink without a .gitmodules mapping, so Actions cannot populate it from a fresh clone."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.console.outputs.available == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Install GoReleaser
        shell: bash
        run: |
          curl -sSL https://github.com/goreleaser/goreleaser/releases/download/v2.15.4/goreleaser_Linux_x86_64.tar.gz \
            | tar -xz goreleaser
          sudo mv goreleaser /usr/local/bin/goreleaser
          goreleaser --version

      - name: Build console
        if: steps.console.outputs.available == 'true'
        working-directory: console
        run: |
          npm ci
          npm run build

      - name: Pre-pull Dagger engine
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if timeout 60s docker pull registry.dagger.io/engine:v0.21.4; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1

      - name: Run CI Pipeline (lint + build)
        uses: dagger/dagger-for-github@v8.4.0
        timeout-minutes: 5
        env:
          DAGGER_NO_NAG: "1"
        with:
          version: v0.21.4
          verb: call
          args: all --source=.
          dagger-flags: --progress plain

      - name: Run vulnerability scan
        uses: dagger/dagger-for-github@v8.4.0
        timeout-minutes: 5
        env:
          DAGGER_NO_NAG: "1"
        with:
          version: v0.21.4
          verb: call
          args: scan --source=.
          dagger-flags: --progress plain

      - name: Export coverage report
        if: success()
        uses: dagger/dagger-for-github@v8.4.0
        timeout-minutes: 5
        env:
          DAGGER_NO_NAG: "1"
        with:
          version: v0.21.4
          verb: call
          args: coverage --source=. export --path=coverage.out
          dagger-flags: --progress plain

      - name: Rehearse release artifacts
        run: make release-readiness

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 30

      - name: Upload release snapshot artifacts
        uses: actions/upload-artifact@v4
        if: success()
        continue-on-error: true
        with:
          name: release-snapshot
          path: |
            dist/
            bin/release-readiness.json
          retention-days: 30
