name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:

# Least-privilege: read-only by default.
permissions:
  contents: read

jobs:
  ci:
    name: Lint + Build + Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Require console sources
        shell: bash
        run: |
          test -f console/package.json
          test -f console/package-lock.json
          test -f console/Dockerfile
          git ls-files --error-unmatch console/package.json console/package-lock.json console/Dockerfile

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1

      - name: Verify Helm install contracts
        run: go run ./hack/helm-contract

      - name: Install GoReleaser
        shell: bash
        run: |
          tool_dir="$(mktemp -d)"
          archive="$tool_dir/goreleaser_Linux_x86_64.tar.gz"
          curl --fail --location --show-error --output "$archive" \
            https://github.com/goreleaser/goreleaser/releases/download/v2.18.0/goreleaser_Linux_x86_64.tar.gz
          echo "41cdf49b653784b03a08013dd99e382cd5d463049e915c2d818eaed182ae6197  $archive" | sha256sum --check -
          tar -xzf "$archive" -C "$tool_dir" goreleaser
          sudo install -m 0755 "$tool_dir/goreleaser" /usr/local/bin/goreleaser
          goreleaser --version

      - name: Build console
        working-directory: console
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run test
          npm run lint
          npx tsc --noEmit
          npm run build
          npm run verify:ssr
          npm run verify:populated

      - name: Build console container
        run: docker build --target runner --tag ckodex-kserve-llm-console:ci console

      - name: Scan console container
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.72.0 image
          --scanners vuln
          --severity CRITICAL,HIGH
          --ignore-unfixed
          --exit-code 1
          ckodex-kserve-llm-console:ci

      - name: Pre-pull Dagger engine
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if timeout 60s docker pull registry.dagger.io/engine:v0.21.9; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1

      - name: Run CI Pipeline (lint + compile)
        uses: dagger/dagger-for-github@v8.4.1
        # Dagger bounds the function at ten minutes. This extra margin covers
        # action installation, cold package loading, session startup, and teardown.
        timeout-minutes: 15
        env:
          DAGGER_NO_NAG: "1"
        with:
          version: v0.21.9
          verb: call
          args: all --source=.
          dagger-flags: --progress plain

      - name: Run Dagger test and coverage gate
        uses: dagger/dagger-for-github@v8.4.1
        timeout-minutes: 15
        env:
          DAGGER_NO_NAG: "1"
        with:
          version: v0.21.9
          verb: call
          args: test --source=.
          dagger-flags: --progress plain

      - name: Run vulnerability scan
        uses: dagger/dagger-for-github@v8.4.1
        timeout-minutes: 5
        env:
          DAGGER_NO_NAG: "1"
        with:
          version: v0.21.9
          verb: call
          args: scan --source=.
          dagger-flags: --progress plain

      - name: Run Hugging Face initializer vulnerability scan
        uses: dagger/dagger-for-github@v8.4.1
        timeout-minutes: 15
        env:
          DAGGER_NO_NAG: "1"
        with:
          version: v0.21.9
          verb: call
          args: scan-hugging-face-initializer-arch --source=. --arch=amd64
          dagger-flags: --progress plain

      - name: Run bidirectional conformance vectors
        uses: dagger/dagger-for-github@v8.4.1
        timeout-minutes: 5
        env:
          DAGGER_NO_NAG: "1"
        with:
          version: v0.21.9
          verb: call
          args: conformance --source=.
          dagger-flags: --progress plain

      - name: Run envtest integration suite
        uses: dagger/dagger-for-github@v8.4.1
        timeout-minutes: 10
        env:
          DAGGER_NO_NAG: "1"
        with:
          version: v0.21.9
          verb: call
          args: integration --source=.
          dagger-flags: --progress plain

      - name: Rehearse release artifacts
        run: make release-readiness

      - name: Upload release snapshot artifacts
        uses: actions/upload-artifact@v7.0.1
        if: success()
        continue-on-error: true
        with:
          name: release-snapshot
          path: |
            dist/
            bin/release-readiness.json
          retention-days: 30

  hf-initializer-arm64:
    name: Hugging Face initializer (arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Pre-pull Dagger engine
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if timeout 60s docker pull registry.dagger.io/engine:v0.21.9; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1

      - name: Scan native arm64 Hugging Face initializer
        uses: dagger/dagger-for-github@v8.4.1
        timeout-minutes: 15
        env:
          DAGGER_NO_NAG: "1"
        with:
          version: v0.21.9
          verb: call
          args: scan-hugging-face-initializer-arch --source=. --arch=arm64
          dagger-flags: --progress plain
