name: Nightly KIND Chaos

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-kind-chaos
  cancel-in-progress: false

jobs:
  kind-chaos:
    name: KIND bootstrap, E2E, and controller recovery
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KIND_CLUSTER_NAME: ckodex-nightly
      OPERATOR_IMAGE: ckodex/kserve-llm-operator:nightly
      STORAGE_INITIALIZER_IMAGE: ckodex/storage-initializer:nightly
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Install KIND
        shell: bash
        run: |
          curl --fail --location --show-error --output kind https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64
          echo "50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54  kind" | sha256sum --check --strict
          chmod +x kind
          sudo mv kind /usr/local/bin/kind
          kind version

      - name: Bootstrap disposable KIND cluster
        run: ./run/e2e.sh

      - name: Run E2E lifecycle and chaos recovery tests
        shell: bash
        run: |
          kubeconfig="$RUNNER_TEMP/kubeconfig"
          kind export kubeconfig --name "$KIND_CLUSTER_NAME" --kubeconfig "$kubeconfig"
          E2E_KUBECONFIG="$kubeconfig" go test -tags=e2e ./test/e2e/... -count=1 -timeout 10m -v

      - name: Collect cluster evidence on failure
        if: failure()
        shell: bash
        run: |
          mkdir -p kind-evidence
          kubectl get all --all-namespaces -o wide > kind-evidence/resources.txt || true
          kubectl get events --all-namespaces --sort-by=.lastTimestamp > kind-evidence/events.txt || true
          kubectl logs deployment/ckodex-controller-manager -n ckodex-system --all-containers=true > kind-evidence/controller.log || true

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-kind-chaos-evidence
          path: kind-evidence/
          retention-days: 14

      - name: Tear down KIND cluster
        if: always()
        run: kind delete cluster --name "$KIND_CLUSTER_NAME" || true
