name: Nightly KIND Chaos

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-kind-chaos
  cancel-in-progress: false

jobs:
  kind-chaos:
    name: KIND bootstrap, E2E, and controller recovery
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KIND_CLUSTER_NAME: ckodex-nightly
      OPERATOR_IMAGE: ckodex/kserve-llm-operator:nightly
      STORAGE_INITIALIZER_IMAGE: ckodex/storage-initializer:nightly
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1

      - name: Install KIND
        shell: bash
        run: |
          kind_version="$(tr -d '\r\n' < deploy/kind/acceptance-kind-version.txt)"
          test "$kind_version" = "v0.33.0"
          curl --fail --location --show-error --output kind "https://kind.sigs.k8s.io/dl/${kind_version}/kind-linux-amd64"
          echo "aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  kind" | sha256sum --check --strict
          chmod +x kind
          sudo mv kind /usr/local/bin/kind
          kind version

      - name: Load KIND acceptance node image
        shell: bash
        run: |
          node_image="$(tr -d '\r\n' < deploy/kind/acceptance-node-image.txt)"
          if [[ ! "$node_image" =~ ^kindest/node:v[0-9]+\.[0-9]+\.[0-9]+@sha256:[a-f0-9]{64}$ ]]; then
            echo "Invalid KIND acceptance node image: $node_image" >&2
            exit 1
          fi
          echo "KIND_NODE_IMAGE=$node_image" >> "$GITHUB_ENV"

      - name: Bootstrap disposable KIND cluster
        run: ./run/e2e.sh

      - name: Run E2E lifecycle and chaos recovery tests
        shell: bash
        run: |
          kubeconfig="$RUNNER_TEMP/kubeconfig"
          kind export kubeconfig --name "$KIND_CLUSTER_NAME" --kubeconfig "$kubeconfig"
          E2E_KUBECONFIG="$kubeconfig" go test -tags=e2e ./test/e2e/... -count=1 -timeout 10m -v

      - name: Collect cluster evidence on failure
        if: failure()
        shell: bash
        run: |
          mkdir -p kind-evidence
          kubectl get all --all-namespaces -o wide > kind-evidence/resources.txt || true
          kubectl get events --all-namespaces --sort-by=.lastTimestamp > kind-evidence/events.txt || true
          kubectl logs -n ckodex-system \
            -l app.kubernetes.io/component=controller-manager \
            --all-containers=true --prefix > kind-evidence/controller.log || true

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: nightly-kind-chaos-evidence
          path: kind-evidence/
          retention-days: 14

      - name: Tear down KIND cluster
        if: always()
        run: kind delete cluster --name "$KIND_CLUSTER_NAME" || true
