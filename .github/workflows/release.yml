name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  verify:
    name: Release Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Install GoReleaser
        shell: bash
        run: |
          curl -sSL https://github.com/goreleaser/goreleaser/releases/download/v2.15.4/goreleaser_Linux_x86_64.tar.gz \
            | tar -xz goreleaser
          sudo mv goreleaser /usr/local/bin/goreleaser
          goreleaser --version

      - name: Install golangci-lint
        shell: bash
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.4.0/install.sh \
            | sh -s -- -b /usr/local/bin v2.4.0
          golangci-lint --version

      - name: Run release verification gates
        shell: bash
        run: |
          golangci-lint run -v --timeout 10m ./ci/...
          go test ./...
          make release-readiness

  # 1. Image build, scan, and publish
  image-release:
    name: Image Build + Push
    needs: [verify]
    runs-on: ubuntu-latest
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-name: ${{ steps.build.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Dagger CLI
        shell: bash
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh \
            | BIN_DIR=/usr/local/bin DAGGER_VERSION=v0.21.4 sh
          dagger version

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.0.0
        with:
          cosign-release: v3.0.4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Dagger SDK
        shell: bash
        run: dagger develop

      - name: Build, scan, and publish image
        id: build
        shell: bash
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          IMAGE_REF: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          IMAGE_VERSION: ${{ github.ref_name }}
          REGISTRY_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          digest=$(dagger call publish \
            --source=. \
            --image-ref="$IMAGE_REF" \
            --version="$IMAGE_VERSION" \
            --registry-username="$REGISTRY_USERNAME" \
            --registry-token=env:GITHUB_TOKEN)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "name=ghcr.io/${{ github.repository }}" >> "$GITHUB_OUTPUT"

      - name: Sign image with cosign (OIDC)
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE_DIGEST}"

      - name: Generate SBOM (CycloneDX via Trivy)
        shell: bash
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          IMAGE_REF: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
        run: |
          mkdir -p sbom
          dagger call sbom \
            --source=. \
            --image-ref="$IMAGE_REF" \
            export --path=sbom/sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/
          retention-days: 90

  # 2. Binary Release (GoReleaser)
  # Generates the multi-arch binaries and creates a GitHub Release (Draft).
  binary-release:
    name: Binary Release
    needs: [verify]
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.0.0
        with:
          cosign-release: v3.0.4
      - name: Run GoReleaser
        id: goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.15.4
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect checksum hashes for SLSA
        id: hashes
        shell: bash
        run: |
          checksum_file=$(printf '%s' '${{ steps.goreleaser.outputs.artifacts }}' | jq -r '.[] | select(.type == "Checksum") | .path' | head -n 1)
          if [ -z "$checksum_file" ] || [ "$checksum_file" = "null" ]; then
            echo "Failed to locate GoReleaser checksum artifact" >&2
            exit 1
          fi
          hashes=$(base64 -w0 < "$checksum_file")
          printf 'hashes=%s\n' "$hashes" >> "$GITHUB_OUTPUT"

  # 3. SLSA L3 Image Provenance
  # Generates non-forgeable provenance for the pushed container images.
  image-provenance:
    needs: [image-release]
    permissions:
      actions: read
      id-token: write
      packages: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.0.0
    with:
      image: ${{ needs.image-release.outputs.image-name }}
      digest: ${{ needs.image-release.outputs.image-digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  # 4. SLSA L3 Binary Provenance
  # Generates non-forgeable provenance for the binaries in the GitHub Release.
  binary-provenance:
    needs: [binary-release]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: "${{ needs.binary-release.outputs.hashes }}"
      upload-assets: true

  # 5. Helm Chart Release
  # Packages the Helm chart and pushes it to GHCR as an OCI artifact.
  helm-release:
    name: Helm Release
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Helm
        uses: azure/setup-helm@v4
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Package & Push Chart
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          chart_version="${RELEASE_VERSION#v}"
          helm package deploy/helm --version "${chart_version}" --app-version "${chart_version}"
          helm push ckodex-kserve-llm-operator-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
