name: Release

on:
  push:
    tags:
      - "v*"

# id-token write is required for cosign keyless signing (OIDC → Fulcio/Rekor).
permissions:
  contents: write      # create GitHub Release + upload assets
  packages: write      # push to ghcr.io
  id-token: write      # OIDC token for cosign keyless signing

env:
  REGISTRY: ghcr.io

jobs:
  release:
    name: Build + Sign + Attest + Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for provenance materials

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Dagger CLI
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh | DAGGER_VERSION=0.15.0 sh
          sudo mv bin/dagger /usr/local/bin/dagger

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Obtain a GitHub OIDC token for cosign keyless signing.
      # Token is short-lived and scoped to this workflow run only.
      # Passed via env var (never interpolated into shell commands).
      - name: Obtain OIDC token
        id: oidc
        run: |
          TOKEN=$(curl -s \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sigstore" | jq -r '.value')
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      # All pipeline logic (build, test, sign, attest) lives in Go (ci/main.go).
      # Trusted github.* context values are passed via env: — not shell-interpolated.
      - name: Run release pipeline
        run: go run ./ci/main.go --push --sign --attest
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGSTORE_ID_TOKEN: ${{ steps.oidc.outputs.token }}
          IMAGE_REF: ${{ env.REGISTRY }}/${{ github.repository }}:${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.ref_name }}
          path: sbom/
          retention-days: 365

      - name: Upload SLSA provenance
        uses: actions/upload-artifact@v4
        with:
          name: slsa-provenance-${{ github.ref_name }}
          path: slsa-provenance.json
          retention-days: 365

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            sbom/sbom.cdx.json
            sbom/sbom.spdx.json
            slsa-provenance.json
