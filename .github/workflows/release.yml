name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  # 1. Verification & Build
  # Runs the Dagger pipeline to ensure the codebase passes all guardrails (Lint/Test/Scan/Lula)
  # then performs the multi-arch build and pushes the images to GHCR.
  build:
    name: Verify + Build + Push
    runs-on: ubuntu-latest
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-name: ${{ steps.build.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.0.0
        with:
          cosign-release: v3.0.4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Dagger Release Pipeline
        id: build
        run: |
          # The Go SDK path is the source of truth for Dagger execution.
          # The --push flag triggers the image push to GHCR.
          go run ./ci/main.go \
            --image ghcr.io/${{ github.repository }}:${{ github.ref_name }} \
            --push \
            --sign
          # Extract digest and name for the next job
          echo "digest=$(cat bin/image-digest.txt)" >> "$GITHUB_OUTPUT"
          echo "name=ghcr.io/${{ github.repository }}" >> "$GITHUB_OUTPUT"
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          VERSION: ${{ github.ref_name }}
          GIT_COMMIT: ${{ github.sha }}
          GIT_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. Binary Release (GoReleaser)
  # Generates the multi-arch binaries and creates a GitHub Release (Draft).
  binary-release:
    name: Binary Release
    needs: [build]
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run GoReleaser
        id: goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.15.4
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect checksum hashes for SLSA
        id: hashes
        shell: bash
        run: |
          checksum_file=$(printf '%s' '${{ steps.goreleaser.outputs.artifacts }}' | jq -r '.[] | select(.type == "Checksum") | .path' | head -n 1)
          if [ -z "$checksum_file" ] || [ "$checksum_file" = "null" ]; then
            echo "Failed to locate GoReleaser checksum artifact" >&2
            exit 1
          fi
          hashes=$(base64 -w0 < "$checksum_file")
          printf 'hashes=%s\n' "$hashes" >> "$GITHUB_OUTPUT"

  # 3. SLSA L3 Image Provenance
  # Generates non-forgeable provenance for the pushed container images.
  image-provenance:
    needs: [build]
    permissions:
      actions: read
      id-token: write
      packages: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.0.0
    with:
      image: ${{ needs.build.outputs.image-name }}
      digest: ${{ needs.build.outputs.image-digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  # 4. SLSA L3 Binary Provenance
  # Generates non-forgeable provenance for the binaries in the GitHub Release.
  binary-provenance:
    needs: [binary-release]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: "${{ needs.binary-release.outputs.hashes }}"
      upload-assets: true

  # 5. Helm Chart Release
  # Packages the Helm chart and pushes it to GHCR as an OCI artifact.
  helm-release:
    name: Helm Release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Helm
        uses: azure/setup-helm@v4
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Package & Push Chart
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          chart_version="${RELEASE_VERSION#v}"
          helm package deploy/helm --version "${chart_version}" --app-version "${chart_version}"
          helm push ckodex-kserve-llm-operator-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
