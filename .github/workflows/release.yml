name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  checks: read
  contents: write
  packages: write
  id-token: write

env:
  RELEASE_VERSION: ${{ github.ref_name }}

jobs:
  verify:
    name: Release Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Verify release identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/tags/$RELEASE_VERSION"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]

      - name: Require hosted CI on the exact release head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          checks="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?filter=latest&per_page=100")"
          for required in "Lint + Build + Scan" "Hugging Face initializer (arm64)"; do
            conclusion="$(jq -r --arg name "$required" \
              '[.check_runs[] | select(.name == $name)] | sort_by(.completed_at) | last | .conclusion // "missing"' \
              <<<"$checks")"
            if [[ "$conclusion" != "success" ]]; then
              echo "Required exact-head check '$required' is $conclusion for $GITHUB_SHA" >&2
              exit 1
            fi
          done

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1

      - name: Install GoReleaser
        shell: bash
        run: |
          tool_dir="$(mktemp -d)"
          archive="$tool_dir/goreleaser_Linux_x86_64.tar.gz"
          curl --fail --location --show-error --output "$archive" \
            https://github.com/goreleaser/goreleaser/releases/download/v2.18.0/goreleaser_Linux_x86_64.tar.gz
          echo "41cdf49b653784b03a08013dd99e382cd5d463049e915c2d818eaed182ae6197  $archive" | sha256sum --check -
          tar -xzf "$archive" -C "$tool_dir" goreleaser
          sudo install -m 0755 "$tool_dir/goreleaser" /usr/local/bin/goreleaser
          goreleaser --version

      - name: Install golangci-lint
        shell: bash
        run: |
          tool_dir="$(go env GOPATH)/bin"
          GOBIN="$tool_dir" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1
          "$tool_dir/golangci-lint" --version

      - name: Run release verification gates
        shell: bash
        run: |
          git ls-files --error-unmatch console/package.json console/package-lock.json console/Dockerfile
          "$(go env GOPATH)/bin/golangci-lint" run -v --timeout 10m ./...
          go test ./...
          go run ./hack/helm-contract
          make release-readiness

      - name: Verify manager release-version injection
        shell: bash
        run: |
          manager="$RUNNER_TEMP/manager-version-contract"
          go build -trimpath \
            -ldflags="-s -w -X github.com/ckodex-labs/kserve-llm-operator/internal/version.Version=${RELEASE_VERSION}" \
            -o "$manager" ./cmd/manager
          actual="$($manager --version)"
          if [[ "$actual" != "$RELEASE_VERSION" ]]; then
            echo "Manager reported version '$actual', want '$RELEASE_VERSION'" >&2
            exit 1
          fi

  hf-initializer-arm64:
    name: Hugging Face initializer (arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Pre-pull Dagger engine
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if docker pull registry.dagger.io/engine:v0.21.9; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1

      - name: Scan native arm64 Hugging Face initializer
        uses: dagger/dagger-for-github@v8.4.1
        timeout-minutes: 15
        env:
          DAGGER_NO_NAG: "1"
        with:
          version: v0.21.9
          verb: call
          args: scan-hugging-face-initializer-arch --source=. --arch=arm64
          dagger-flags: --progress plain

  # 1. Image build, scan, and publish
  image-release:
    name: Image Build + Push
    needs: [verify, hf-initializer-arm64]
    runs-on: ubuntu-latest
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-name: ghcr.io/${{ github.repository }}
      hf-initializer-digest: ${{ steps.build-hf-initializer.outputs.digest }}
      hf-initializer-name: ${{ steps.build-hf-initializer.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Dagger CLI
        shell: bash
        run: |
          tool_dir="$(mktemp -d)"
          archive="$tool_dir/dagger_v0.21.9_linux_amd64.tar.gz"
          curl --fail --location --show-error --output "$archive" \
            https://dl.dagger.io/dagger/releases/0.21.9/dagger_v0.21.9_linux_amd64.tar.gz
          echo "33eea0b08d6be444bada18e64b2216459100d6070abcb4b5345cee40c9fff982  $archive" | sha256sum --check -
          tar -xzf "$archive" -C "$tool_dir" dagger
          sudo install -m 0755 "$tool_dir/dagger" /usr/local/bin/dagger
          dagger version

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Dagger SDK
        shell: bash
        run: dagger develop

      - name: Build, scan, and publish image
        id: build
        shell: bash
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          IMAGE_REF: ghcr.io/${{ github.repository }}:${{ env.RELEASE_VERSION }}
          IMAGE_VERSION: ${{ env.RELEASE_VERSION }}
          REGISTRY_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          full_ref=$(dagger call publish \
            --source=. \
            --image-ref="$IMAGE_REF" \
            --version="$IMAGE_VERSION" \
            --registry-username="$REGISTRY_USERNAME" \
            --registry-token=env:GITHUB_TOKEN)
          # full_ref is name:tag@sha256:HASH — extract sha256:HASH for SLSA
          digest=$(echo "$full_ref" | grep -oE 'sha256:[a-f0-9]+')
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "name=ghcr.io/${{ github.repository }}" >> "$GITHUB_OUTPUT"

      - name: Sign image with cosign (OIDC)
        shell: bash
        env:
          # cosign needs name@sha256:HASH — compose from the two step outputs
          COSIGN_REF: ${{ steps.build.outputs.name }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${COSIGN_REF}"

      - name: Build, scan, and publish Hugging Face initializer
        id: build-hf-initializer
        shell: bash
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          IMAGE_REF: ghcr.io/${{ github.repository }}-huggingface-initializer:${{ env.RELEASE_VERSION }}
          REGISTRY_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dagger call scan-hugging-face-initializer-arch --source=. --arch=amd64
          full_ref=$(dagger call publish-hugging-face-initializer \
            --source=. \
            --image-ref="$IMAGE_REF" \
            --registry-username="$REGISTRY_USERNAME" \
            --registry-token=env:GITHUB_TOKEN)
          digest=$(echo "$full_ref" | grep -oE 'sha256:[a-f0-9]+')
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "name=ghcr.io/${{ github.repository }}-huggingface-initializer" >> "$GITHUB_OUTPUT"

      - name: Sign Hugging Face initializer with cosign (OIDC)
        shell: bash
        env:
          COSIGN_REF: ${{ steps.build-hf-initializer.outputs.name }}@${{ steps.build-hf-initializer.outputs.digest }}
        run: cosign sign --yes "${COSIGN_REF}"

      - name: Generate SBOM (CycloneDX via Trivy)
        shell: bash
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          IMAGE_REF: ghcr.io/${{ github.repository }}:${{ env.RELEASE_VERSION }}
          REGISTRY_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p sbom
          dagger call sbom \
            --source=. \
            --image-ref="$IMAGE_REF" \
            --registry-username="$REGISTRY_USERNAME" \
            --registry-token=env:GITHUB_TOKEN \
            export --path=sbom/manager.cdx.json
          dagger call sbom \
            --source=. \
            --image-ref="${IMAGE_REF%:*}-huggingface-initializer:${RELEASE_VERSION}" \
            --registry-username="$REGISTRY_USERNAME" \
            --registry-token=env:GITHUB_TOKEN \
            export --path=sbom/huggingface-initializer.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sbom
          path: sbom/
          retention-days: 90

  # 2. Console image build, scan metadata, and publish
  console-image-release:
    name: Console Image Build + Push
    needs: [verify]
    runs-on: ubuntu-latest
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-name: ghcr.io/${{ github.repository_owner }}/ckodex-kserve-llm-console
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish console image
        id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: ./console
          file: ./console/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ckodex-kserve-llm-console:${{ env.RELEASE_VERSION }}
          provenance: mode=max
          sbom: true

      - name: Scan published console image
        env:
          CONSOLE_REF: ghcr.io/${{ github.repository_owner }}/ckodex-kserve-llm-console@${{ steps.build.outputs.digest }}
        run: |
          docker pull "${CONSOLE_REF}"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.72.0 image \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            "${CONSOLE_REF}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign console image with cosign (OIDC)
        env:
          COSIGN_REF: ghcr.io/${{ github.repository_owner }}/ckodex-kserve-llm-console@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${COSIGN_REF}"

  # 2. Binary Release (GoReleaser)
  # Generates the multi-arch binaries and creates a GitHub Release (Draft).
  binary-release:
    name: Binary Release
    needs: [verify]
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Run GoReleaser
        id: goreleaser
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload checksummed CRD bundle
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash hack/crd-bundle.sh dist/ckodex-crds.yaml
          gh release upload "${GITHUB_REF_NAME}" \
            dist/ckodex-crds.yaml dist/ckodex-crds.yaml.sha256 --clobber

      - name: Collect checksum hashes for SLSA
        id: hashes
        shell: bash
        run: |
          checksum_file=$(printf '%s' '${{ steps.goreleaser.outputs.artifacts }}' | jq -r '.[] | select(.type == "Checksum") | .path' | head -n 1)
          if [ -z "$checksum_file" ] || [ "$checksum_file" = "null" ]; then
            echo "Failed to locate GoReleaser checksum artifact" >&2
            exit 1
          fi
          hashes=$(base64 -w0 < "$checksum_file")
          printf 'hashes=%s\n' "$hashes" >> "$GITHUB_OUTPUT"

  # 3. SLSA L3 Image Provenance
  # Generates non-forgeable provenance for the pushed container images.
  image-provenance:
    needs: [image-release]
    permissions:
      actions: read
      id-token: write
      packages: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ needs.image-release.outputs.image-name }}
      digest: ${{ needs.image-release.outputs.image-digest }}
      registry-username: ${{ github.actor }}
      private-repository: true
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  console-image-provenance:
    needs: [console-image-release]
    permissions:
      actions: read
      id-token: write
      packages: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ needs.console-image-release.outputs.image-name }}
      digest: ${{ needs.console-image-release.outputs.image-digest }}
      registry-username: ${{ github.actor }}
      private-repository: true
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  hf-initializer-provenance:
    needs: [image-release]
    permissions:
      actions: read
      id-token: write
      packages: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ needs.image-release.outputs.hf-initializer-name }}
      digest: ${{ needs.image-release.outputs.hf-initializer-digest }}
      registry-username: ${{ github.actor }}
      private-repository: true
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  # 4. SLSA L3 Binary Provenance
  # Generates non-forgeable provenance for the binaries in the GitHub Release.
  binary-provenance:
    needs: [binary-release]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.binary-release.outputs.hashes }}"
      upload-assets: true
      private-repository: true

  # 5. Helm Chart Release
  # Packages the Helm chart and pushes it to GHCR as an OCI artifact.
  helm-release:
    name: Helm Release
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install Helm
        uses: azure/setup-helm@v5.0.1
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Package & Push Chart
        run: |
          set -euo pipefail
          chart_version="${RELEASE_VERSION#v}"
          chart_package="$RUNNER_TEMP/ckodex-kserve-llm-operator-${chart_version}.tgz"
          helm package deploy/helm \
            --version "${chart_version}" \
            --app-version "${RELEASE_VERSION}" \
            --destination "$RUNNER_TEMP"
          rendered="$RUNNER_TEMP/helm-rendered.yaml"
          helm template release "$chart_package" \
            --namespace ckodex-system \
            --set console.enabled=true > "$rendered"
          for image in \
            "ghcr.io/ckodex-labs/ckodex-kserve-llm:${RELEASE_VERSION}" \
            "ghcr.io/ckodex-labs/ckodex-kserve-llm-console:${RELEASE_VERSION}" \
            "ghcr.io/ckodex-labs/ckodex-kserve-llm-huggingface-initializer:${RELEASE_VERSION}"; do
            grep -Fq "$image" "$rendered"
          done
          helm push "$chart_package" oci://ghcr.io/${{ github.repository_owner }}/charts

  # 6. Public artifact acceptance
  # Uses only anonymous GHCR bearer tokens. A release fails if any published
  # tag is private, missing, points at the wrong digest, or lacks an architecture.
  public-release-contract:
    name: Public Release Contract
    needs: [image-release, console-image-release, image-provenance, console-image-provenance, hf-initializer-provenance, helm-release]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify anonymous artifact retrieval
        shell: bash
        run: |
          go run ./hack/public-release-contract \
            --repository="ghcr.io/${{ github.repository }}" \
            --console-repository="ghcr.io/${{ github.repository_owner }}/ckodex-kserve-llm-console" \
            --chart-repository="ghcr.io/${{ github.repository_owner }}/charts/ckodex-kserve-llm-operator" \
            --version="${RELEASE_VERSION}" \
            --operator-digest="${{ needs.image-release.outputs.image-digest }}" \
            --console-digest="${{ needs.console-image-release.outputs.image-digest }}" \
            --initializer-digest="${{ needs.image-release.outputs.hf-initializer-digest }}"
