version: "2"
run:
  issues-exit-code: 1
  tests: true
  concurrency: 2
linters:
  default: none
  enable:
    - asciicheck
    - bodyclose
    - durationcheck
    - errcheck
    - errorlint
    - gosec
    - govet
    - misspell
    - nakedret
    - nilerr
    - noctx
    - nolintlint
    - staticcheck
    - unconvert
    - unused
    - whitespace
  settings:
    gosec:
      includes:
        - G102
        - G103
        - G104
        - G101
        - G106
        - G108
        - G109
        - G110
        - G111
        - G112
        - G113
        - G114
        - G107
        - G204
        - G201
        - G202
        - G203
        - G301
        - G302
        - G303
        - G304
        - G305
        - G306
        - G307
        - G401
        - G402
        - G403
        - G404
        - G501
        - G502
        - G503
        - G504
        - G505
        - G601
  exclusions:
    generated: lax
    rules:
      # These are pre-existing, path-scoped findings in trusted plumbing and
      # identifier constants; new findings outside these exact files remain
      # blocking. Retire each exception as its owning subsystem is hardened.
      - linters:
          - gosec
        path: ^(internal/auth/apikey\.go|internal/config/startup_validation\.go|internal/controller/imagepullsecret_reconciler\.go|internal/observability/(audit|events|ois_v01)\.go)$
        text: "G101:"
      - linters:
          - gosec
        path: ^(cmd/huggingface-initializer/main\.go|cmd/storage-initializer/main\.go|hack/helm-contract/main\.go)$
        text: "G204:"
      - linters:
          - gosec
        path: ^(cmd/storage-initializer/main\.go|internal/observability/audit\.go|internal/storage/(github_client|gitlab_client|gs_client|oci_client|parallel_download|s3_client)\.go)$
        text: "G301:"
      - linters:
          - gosec
        path: ^(cmd/storage-initializer/main\.go|hack/helm-contract/main\.go|internal/storage/(checksum|github_client|gs_client|oci_client|parallel_download|s3_client|seaweedfs_client)\.go)$
        text: "G304:"
      - linters:
          - gosec
        path: ^internal/storage/gitlab_client\.go$
        text: "G306:"
      - linters:
          - gosec
        path: ^(internal/chaos/engine\.go|internal/observability/metrics_querier\.go)$
        text: "G404:"
      - linters:
          - gosec
        path: _test\.go
      - linters:
          - nilerr
          - noctx
        path: _test\.go
      - linters:
          - nilerr
        path: ^test/
      - linters:
          - noctx
        path: ^test/
      - linters:
          - staticcheck
        text: "GetEventRecorderFor is deprecated"
    paths:
      - third_party$
      - builtin$
      - examples$
      - (^|/)(node_modules|vendor)(/|$)
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - (^|/)(node_modules|vendor)(/|$)
