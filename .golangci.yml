version: "2"
run:
  issues-exit-code: 1
  tests: false
  concurrency: 2
linters:
  default: none
  enable:
    - asciicheck
    - bodyclose
    - durationcheck
    - errcheck
    - errorlint
    - gosec
    - govet
    - misspell
    - nakedret
    - nilerr
    - noctx
    - nolintlint
    - staticcheck
    - unconvert
    - unused
    - whitespace
  settings:
    gosec:
      includes:
        - G102
        - G103
        - G104
        - G106
        - G108
        - G109
        - G110
        - G111
        - G112
        - G113
        - G114
        - G201
        - G202
        - G203
        - G302
        - G303
        - G305
        - G307
        - G401
        - G402
        - G403
        - G501
        - G502
        - G503
        - G504
        - G505
        - G601
  exclusions:
    generated: lax
    rules:
      - linters:
          - gosec
        path: _test\.go
      - linters:
          - nilerr
          - noctx
        path: _test\.go
      - linters:
          - nilerr
        path: ^test/
      - linters:
          - noctx
        path: ^test/
      - linters:
          - staticcheck
        text: "SA1019: mgr.GetEventRecorderFor is deprecated"
    paths:
      - third_party$
      - builtin$
      - examples$
      - (^|/)(node_modules|vendor)(/|$)
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - (^|/)(node_modules|vendor)(/|$)
