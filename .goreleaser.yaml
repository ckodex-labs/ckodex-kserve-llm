# .goreleaser.yaml — Production Release Configuration for CKodex KServe LLM Operator
version: 2

project_name: kserve-llm-operator

builds:
  - id: manager
    main: ./cmd/manager/main.go
    binary: manager
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/ckodex-labs/kserve-llm-operator/internal/version.Version={{.Version}}

  - id: storage-initializer
    main: ./cmd/storage-initializer/main.go
    binary: storage-initializer
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: manager
    ids:
      - manager
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_manager_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  - id: storage-initializer
    ids:
      - storage-initializer
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_storage-initializer_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

# GitHub Release Configuration
release:
  github:
    owner: ckodex-labs
    name: ckodex-kserve-llm
  draft: true # Start as draft for manual review
  prerelease: auto

# Container images are built, pushed, and signed by the Dagger release path in
# .github/workflows/release.yml. GoReleaser is limited to binary archives and
# checksum assets so the tag workflow has a single source of truth for images.

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
