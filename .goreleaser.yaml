# .goreleaser.yaml — Production Release Configuration for CKodex KServe LLM Operator
version: 2

project_name: kserve-llm-operator

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: manager
    main: ./cmd/manager/main.go
    binary: manager
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/ckodex-labs/kserve-llm-operator/internal/version.Version={{.Version}}

  - id: storage-initializer
    main: ./cmd/storage-initializer/main.go
    binary: storage-initializer
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

# GitHub Release Configuration
release:
  github:
    owner: ckodex-labs
    name: kserve-llm-operator
  draft: true # Start as draft for manual review
  prerelease: auto

# Docker Images
dockers_v2:
  - id: manager
    ids:
      - manager
    images:
      - "ghcr.io/ckodex-labs/kserve-llm-operator:{{ .Version }}"
    dockerfile: Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
    flags:
      - "--target=manager"
    build_args:
      VERSION: "{{ .Version }}"

  - id: storage-initializer
    ids:
      - storage-initializer
    images:
      - "ghcr.io/ckodex-labs/storage-initializer:{{ .Version }}"
    dockerfile: Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
    flags:
      - "--target=storage-initializer"

# Image Signing (Cosign) — Managed by CI for keyless OIDC signing.
# GoReleaser only handles binary signing here if needed (deprecated in favor of SLSA).
# signs: [] 

# SLSA Provenance (L1/L2 Metadata)
# L3 Provenance is delegated to the slsa-framework/slsa-github-generator in GHA.
provenance:
  enabled: true
  # Generates the .intoto.jsonl predicate that the SLSA generator will encapsulate.
  # This provides the base identity for the non-forgeable L3 envelope.
