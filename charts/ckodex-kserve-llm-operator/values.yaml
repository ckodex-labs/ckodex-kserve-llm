# Default values for ckodex-kserve-llm-operator.

replicaCount: 1

image:
  repository: ghcr.io/ckodex-labs/kserve-llm-operator
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

crds:
  install: false

featureGates:
  enableScheduler: true
  enableGateway: true
  enableAutoscaler: true
  enableSecurity: true
  enableLocalModelCache: true

runtime:
  # Default vLLM image
  defaultImage: "vllm/vllm-openai-cpu:v0.19.0"
  # Gemma-specific image
  gemma4Image: "vllm/vllm-openai:gemma4"

config:
  # HuggingFace Mirror for air-gapped environments
  hfMirror: ""
  # OpenTelemetry collector endpoint
  otelEndpoint: "localhost:4317"

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL

service:
  type: ClusterIP
  port: 80

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}
