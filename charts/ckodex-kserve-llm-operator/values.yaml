# Default values for ckodex-kserve-llm-operator.

replicaCount: 1

image:
  repository: ghcr.io/ckodex-labs/ckodex-kserve-llm
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: true

# managedNamespaces lists namespaces where the platform pre-provisions the
# shared ckodex-epp ServiceAccount, Role, and RoleBinding. If unset, the
# operator namespace is used as the implicit managed namespace to avoid a
# silent no-op install. Add additional workload namespaces explicitly.
managedNamespaces: []

crds:
  install: false

featureGates:
  enableScheduler: true
  enableGateway: true
  enableAutoscaler: true
  enableSecurity: false
  enableLocalModelCache: false

runtime:
  # v0.28.0 includes the mixed-dtype NVFP4 correctness fix used by Gemma/Qwen.
  defaultImage: "vllm/vllm-openai:v0.28.0"
  # Installed KServe ClusterServingRuntime for v0.19 workerSpec workloads.
  kserveMultiNodeRuntime: "kserve-huggingfaceserver-multinode"
  # Empty follows Chart.appVersion; set a digest-pinned override when required.
  huggingFaceInitializerImage: ""
  customStorageInitializerImage: "ckodex/storage-initializer:v0.1.0"
  vllmCPURequest: "2"
  vllmMemoryRequest: "4Gi"
  terminationGracePeriodSeconds: 60
  asrCPURequest: "1"
  asrMemoryRequest: "2Gi"
  asrTerminationGracePeriodSeconds: 30
  cacheCPURequest: "1"
  cacheMemoryRequest: "1Gi"

gateway:
  # Namespace where Envoy Gateway creates its data-plane proxy pods.
  dataPlaneNamespace: "envoy-gateway-system"

config:
  # HuggingFace Mirror for air-gapped environments
  hfMirror: ""
  # OpenTelemetry collector endpoint
  otelEndpoint: "localhost:4317"

audit:
  # Optional OTLP/HTTP logs endpoint. Empty keeps the audit log sink local.
  otlpEndpoint: ""
  persistence:
    enabled: false
    storageClass: ""
    size: 1Gi
    accessModes:
      - ReadWriteOnce

metrics:
  enabled: true
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s

console:
  # Disabled by default; an empty tag follows Chart.appVersion when enabled.
  enabled: false
  replicas: 1
  spireRegistrationNamespace: spire
  image:
    repository: ghcr.io/ckodex-labs/ckodex-kserve-llm-console
    pullPolicy: IfNotPresent
    tag: ""
  service:
    type: ClusterIP
    port: 3000
  serviceAccount:
    create: true
    name: ""
    annotations: {}
    automountServiceAccountToken: true
  rbac:
    create: true
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL

service:
  type: ClusterIP
  port: 80

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}
