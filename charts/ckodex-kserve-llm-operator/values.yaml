# Default values for ckodex-kserve-llm-operator.

replicaCount: 1

image:
  repository: ghcr.io/ckodex-labs/ckodex-kserve-llm
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: true

crds:
  install: false

featureGates:
  enableScheduler: true
  enableGateway: true
  enableAutoscaler: true
  enableSecurity: false
  enableLocalModelCache: false

runtime:
  # v0.25.1 includes the mixed-dtype NVFP4 correctness fix used by Gemma/Qwen.
  defaultImage: "vllm/vllm-openai:v0.25.1"
  # Installed KServe ClusterServingRuntime for v0.19 workerSpec workloads.
  kserveMultiNodeRuntime: "kserve-huggingfaceserver-multinode"
  # Purpose-built Xet-aware image; dependencies are installed at image build time.
  huggingFaceInitializerImage: "ghcr.io/ckodex-labs/ckodex-kserve-llm-huggingface-initializer:v0.18.0-beta.7"
  customStorageInitializerImage: "ckodex/storage-initializer:v0.1.0"
  quantCppImage: "ckodex/quant-cpp:v0.1.0"
  vllmCPURequest: "2"
  vllmMemoryRequest: "4Gi"
  terminationGracePeriodSeconds: 60
  asrCPURequest: "1"
  asrMemoryRequest: "2Gi"
  asrTerminationGracePeriodSeconds: 30
  cacheCPURequest: "1"
  cacheMemoryRequest: "1Gi"

gateway:
  # Namespace where Envoy Gateway creates its data-plane proxy pods.
  dataPlaneNamespace: "envoy-gateway-system"

config:
  # HuggingFace Mirror for air-gapped environments
  hfMirror: ""
  # OpenTelemetry collector endpoint
  otelEndpoint: "localhost:4317"
  # Quant.cpp defaults
  quantCpp:
    ctxSize: 32768
    nGpuLayersDetect: true

audit:
  persistence:
    enabled: false
    storageClass: ""
    size: 1Gi
    accessModes:
      - ReadWriteOnce

metrics:
  enabled: true
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s

console:
  # No public console image is published with the operator release yet.
  enabled: false
  replicas: 1
  image:
    # Required when console.enabled=true; no console image ships by default.
    repository: ""
    pullPolicy: IfNotPresent
    tag: ""
  service:
    type: ClusterIP
    port: 3000

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL

service:
  type: ClusterIP
  port: 80

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}
