                items:
                  description: MemberStatus tracks an individual member's state.
                  properties:
                    name:
                      type: string
                    ready:
                      type: boolean
                    role:
                      type: string
                    state:
                      description: ActorState represents the actor lifecycle.
                      type: string
                  required:
                  - name
                  - ready
                  - role
                  - state
                  type: object
                type: array
              phase:
                description: Phase is the group lifecycle phase.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
