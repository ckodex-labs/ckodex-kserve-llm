              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: InferenceSessionSpec defines the desired session state.
            properties:
              actorRef:
                description: ActorRef optionally binds this session to a specific
                  InferenceActor.
                type: string
              coactorGroupRef:
                description: CoactorGroupRef binds this session to a CoactorGroup
                  for multi-model collaboration.
                type: string
              maxTurns:
                default: 0
                description: MaxTurns limits the number of conversation turns per
                  session. 0 = unlimited.
                format: int32
                type: integer
              metadata:
                additionalProperties:
                  type: string
                description: Metadata holds caller-supplied key-value pairs (user
                  ID, conversation ID, etc).
                type: object
              modelRef:
                description: ModelRef references the LLMInferenceService serving this
                  session.
                type: string
              ttl:
                default: 30m
                description: TTL is the session time-to-live after last activity.
                type: string
            required:
            - modelRef
            type: object
          status:
            description: InferenceSessionStatus defines the observed session state.
            properties:
              boundEndpoint:
                description: BoundEndpoint is the pod IP:port holding the KV-cache
                  for this session.
                type: string
              conditions:
                description: Conditions track session health.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
