                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              kvCacheSize:
                description: KVCacheSize is the estimated KV-cache size in bytes.
                format: int64
                type: integer
              lastActivityTime:
                description: LastActivityTime is the timestamp of the last inference
                  request.
                format: date-time
                type: string
              phase:
                description: Phase is the session lifecycle phase.
                type: string
              tokenCount:
                description: TokenCount is the total tokens processed in this session.
                format: int64
                type: integer
              turnCount:
                description: TurnCount tracks the number of completed turns.
                format: int32
                type: integer
            type: object
        type: object
