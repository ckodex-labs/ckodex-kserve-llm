    name: v1alpha2
    schema:
      openAPIV3Schema:
        description: |-
          LLMLoraAdapter is the Schema for the LLM LoRA Adapter API.
          It allows users to dynamically hot-swap fine-tuned weights (PEFT)
          into an active LLMInferenceService without downtime.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: LLMLoraAdapterSpec defines the desired state of LLMLoraAdapter.
            properties:
              adapterName:
                description: |-
                  AdapterName is the logical identifier used at inference time.
                  Example: 'sql-helper'
                minLength: 1
                type: string
              behavior:
                description: Behavior defines the expected impact of this adapter
                  on core behavior axes.
                properties:
                  refusal:
                    description: Refusal fidelity (strength of system prompt adherence).
                    type: string
                  safety:
                    description: Safety level (0-10) where 10 is safest.
                    type: integer
                  toolPropensity:
                    description: ToolPropensity - declared intensity of tool usage
                      ('conservative', 'moderate', 'aggressive').
                    type: string
                type: object
              model:
                description: Model specifies the LoRA weights to serve.
                properties:
                  hardwareAware:
                    description: |-
                      HardwareAware enables automatic hardware-specific artifact selection.
                      When true, the operator appends hardware suffixes to OCI tags (e.g., -nvidia).
                      Requires ENABLE_EXPERIMENTAL_HARDWARE_SELECTION feature gate.
                    type: boolean
                  name:
                    description: |-
                      Name is the model identifier used in inference requests.
                      This is the value clients use in the "model" field of chat/completion requests.
                    type: string
                  storage:
                    description: |-
                      Storage configures credentials for model download.
                      Mirrors LocalModelCache credential support.
                    properties:
                      externalSecret:
                        description: |-
                          ExternalSecret configures native integration with external-secrets.io.
                          When set, the operator creates an ExternalSecret resource to sync
                          credentials from an external provider (Vault, AWS SM, etc.).
                        properties:
                          data:
                            description: Data defines the mapping of remote keys to
                              local secret keys.
                            items:
                              description: ExternalSecretData defines a single mapping
                                of a remote secret to a local key.
                              properties:
                                remoteRef:
                                  description: RemoteRef defines where to fetch the
                                    secret from the provider.
                                  properties:
                                    key:
                                      description: Key is the name/path of the secret
                                        in the external provider.
                                      type: string
                                    property:
                                      description: Property is the specific field
                                        to extract from the remote secret.
                                      type: string
                                  required:
                                  - key
                                  type: object
                                secretKey:
                                  description: SecretKey is the key in the resulting
                                    Kubernetes Secret.
                                  type: string
                              required:
                              - remoteRef
                              - secretKey
                              type: object
                            type: array
                          refreshInterval:
                            default: 1h
                            description: RefreshInterval is how often to re-sync the
                              secret from the provider.
                            type: string
                          secretStoreRef:
                            description: SecretStoreRef references the SecretStore/ClusterSecretStore
                              to use.
                            properties:
                              kind:
                                default: SecretStore
                                description: Kind of the SecretStore (SecretStore
                                  or ClusterSecretStore).
                                type: string
                              name:
                                description: Name of the SecretStore.
                                type: string
                            required:
                            - name
                            type: object
                        required:
                        - secretStoreRef
                        type: object
                      secretRef:
                        description: SecretRef is a reference to a Secret containing
                          storage credentials.
                        properties:
                          name:
                            default: ""
                            description: |-
                              Name of the referent.
                              This field is effectively required, but due to backwards compatibility is
                              allowed to be empty. Instances of this type with an empty value here are
                              almost certainly wrong.
                              More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                            type: string
                        type: object
                        x-kubernetes-map-type: atomic
                      serviceAccountName:
                        description: ServiceAccountName is the name of a ServiceAccount
                          with storage access.
                        type: string
                      storageContainerRef:
                        description: StorageContainerRef references a ClusterStorageContainer
                          for download config.
                        type: string
                      vaultAddr:
                        description: VaultAddr is the address of the HashiCorp Vault
                          server.
                        type: string
                      vaultRef:
                        description: VaultRef is a reference to a Vault path containing
                          storage credentials.
                        type: string
                    type: object
                  uri:
                    description: |-
                      URI is the model artifact location.
                      Supported schemes: hf:// (HuggingFace Hub), hf-mount:// (HuggingFace CSI lazy mount),
                      s3://, swfs://, gs://, pvc://, oci://, ocis://, modelpack://.
                      hf-mount:// uses the hf-csi-driver to mount repos as a FUSE/NFS filesystem —
                      only accessed bytes are fetched, eliminating full model downloads.
                      `ocis://` is an explicit secure-OCI alias and follows the same runtime
                      verification path as `oci://`, while making the intent visible at the spec boundary.
                    pattern: ^(hf|hf-mount|s3|swfs|gs|pvc|oci|ocis|modelpack|https?)://.*$
                    type: string
                required:
                - name
                - uri
                type: object
              policyEnvelope:
                description: PolicyEnvelope constrains allowed loading and tool use
                  for this adapter.
                properties:
                  allowedDomains:
                    description: Domain restrictions (e.g. 'coding', 'general').
                    items:
                      type: string
                    type: array
                  minTrustLevel:
                    description: Required trust levels for execution.
                    type: string
                type: object
              sandbox:
                description: |-
                  Sandbox enables header-based virtual routing for this adapter.
                  When enabled, requests with 'x-ckodex-adapter: <headerValue>' are
                  matched against this adapter.
                properties:
                  enable:
                    description: Enable activates the sandbox route in the associated
                      Gateway HTTPRoute.
                    type: boolean
                  headerValue:
                    description: |-
                      HeaderValue is the value to match in the 'x-ckodex-adapter' header.
                      Example: 'sql-test-v1'
                    type: string
                type: object
              targetService:
                description: |-
                  TargetService is the name of the LLMInferenceService to attach this LoRA to.
                  The service must be in the same namespace.
                type: string
              toolSurface:
                description: ToolSurface declares reachable APIs and external connectors
                  for this adapter.
                properties:
                  allowedApis:
                    description: AllowedAPIs is a list of FQDNs that the model is
                      permitted to reach.
                    items:
                      type: string
                    type: array
                  allowedCidrs:
                    description: AllowedCIDRs is a list of network ranges the model
                      is permitted to reach.
                    items:
                      type: string
                    type: array
                type: object
            required:
            - adapterName
            - model
            - targetService
            type: object
          status:
            description: LLMLoraAdapterStatus defines the observed state of LLMLoraAdapter.
            properties:
              activeRevision:
                description: ActiveRevision tracks the generation that was successfully
                  loaded.
                format: int64
                type: integer
              conditions:
                description: Conditions represent the latest available observations.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              evidenceBundle:
                description: EvidenceBundle stores receipts, attestations and provenance
                  data.
                properties:
                  attestationUri:
                    description: SLSA attestation URI.
                    type: string
                  lastVerifiedAt:
                    description: Last verification timestamp.
                    format: date-time
                    type: string
                  sbomDigest:
                    description: CycloneDX SBOM digest.
                    type: string
                  signatureDigest:
                    description: Cosign signature digest.
                    type: string
                type: object
              statePlanes:
                description: StatePlanes represents the governed composite state of
                  the model system.
                properties:
                  binding:
                    description: 'Deprecated: Binding is not reconciled by any controller.
                      Tracked for removal in v0.3.0.'
                    type: string
                  composition:
                    description: 'Deprecated: Composition is not reconciled by any
                      controller. Tracked for removal in v0.3.0.'
                    type: string
                  lifecycle:
                    type: string
                  risk:
                    type: string
                  trust:
                    type: string
                type: object
            type: object
        type: object
    served: true
    storage: false
    subresources:
      status: {}
