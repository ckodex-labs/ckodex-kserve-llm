                type: object
              sourceModelUri:
                description: |-
                  SourceModelURI is the model artifact to cache.
                  Supported schemes: hf://, s3://, swfs://, gs://, pvc://, oci://.
                pattern: ^(hf|s3|swfs|gs|pvc|oci|https?)://.*$
                type: string
              storage:
                description: Storage configures credentials for model download.
                properties:
                  secretName:
                    description: |-
                      SecretName references a Secret with storage credentials.
                      The Secret must contain keys appropriate for the storage backend.
                    type: string
                  serviceAccountName:
                    description: |-
                      ServiceAccountName references a ServiceAccount with
                      storage access (e.g., for GCS or S3 via IRSA).
                    type: string
                  storageContainerRef:
                    description: |-
                      StorageContainerRef references a ClusterStorageContainer
                      for custom storage initializer configuration.
                    type: string
                type: object
              storageClassName:
                description: |-
                  StorageClassName is the StorageClass to use for cache PVCs.
                  If empty, the cluster default StorageClass is used.
                type: string
              warmNodes:
                description: |-
                  WarmNodes is a list of node names to pre-warm with cached model data.
                  PVCs and storage initializer Jobs are created on these nodes before
                  any LLMInferenceService references the model. Warm-up Jobs follow the
                  same "Guaranteed QoS" and 30s termination grace period patterns for
                  optimal scheduling.
                items:
                  type: string
                type: array
            required:
            - sourceModelUri
            type: object
          status:
            description: LocalModelCacheStatus defines the observed state.
            properties:
              availableSpace:
                description: |-
                  AvailableSpace is MaxCacheSize minus TotalCacheSize.
                  Empty if MaxCacheSize is not set.
                type: string
              cachedModels:
                description: CachedModels tracks which models are cached, where, and
                  when last used.
                items:
                  description: CachedModelStatus tracks a single cached model across
                    nodes.
                  properties:
                    lastUsed:
                      description: LastUsed is when this cached model was last mounted
                        by an inference pod.
                      format: date-time
                      type: string
                    modelUri:
                      description: ModelURI is the source model URI.
                      type: string
                    nodeNames:
                      description: NodeNames lists nodes where this model is cached.
                      items:
                        type: string
                      type: array
                    pvcName:
                      description: PVCName is the content-addressable PVC name for
                        this model.
                      type: string
                    sizeBytes:
                      description: SizeBytes is the size of the cached model in bytes.
                      format: int64
                      type: integer
                  required:
                  - modelUri
                  - nodeNames
                  - pvcName
                  type: object
                type: array
              cachedNodes:
                description: CachedNodes is the count of nodes with a complete local
                  cache.
                format: int32
                type: integer
              conditions:
                description: Conditions represent the latest available observations.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              nodeStatuses:
                description: NodeStatuses tracks per-node download state.
                items:
                  description: NodeCacheStatus tracks model cache status on a single
                    node.
                  properties:
                    lastTransitionTime:
                      description: LastTransitionTime is when the phase last changed.
                      format: date-time
                      type: string
                    lastUsed:
                      description: LastUsed is when this node cache was last used
                        by an inference pod.
                      format: date-time
                      type: string
                    modelUriHash:
                      description: ModelURIHash is the content-addressable hash of
                        the model URI.
                      type: string
                    nodeName:
                      description: NodeName identifies the node.
                      type: string
                    phase:
                      description: Phase is the download phase.
                      enum:
                      - Pending
                      - Downloading
                      - Ready
                      - Failed
                      type: string
                    pvcName:
                      description: PVCName is the name of the PVC holding the cached
                        model.
                      type: string
                    sizeBytes:
                      description: SizeBytes is the observed size of this cache entry.
                      format: int64
                      type: integer
                  required:
                  - nodeName
                  - phase
                  type: object
                type: array
              totalCacheSize:
                description: TotalCacheSize is the sum of all cached PVC sizes.
                type: string
            required:
            - cachedNodes
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
