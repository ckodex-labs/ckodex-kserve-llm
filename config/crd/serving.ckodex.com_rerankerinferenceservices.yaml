  group: serving.ckodex.com
  names:
    kind: RerankerInferenceService
    listKind: RerankerInferenceServiceList
    plural: rerankerinferenceservices
    shortNames:
    - reranker
    singular: rerankerinferenceservice
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.model.name
      name: Model
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha2
    schema:
      openAPIV3Schema:
        description: |-
          RerankerInferenceService manages cross-encoder reranking models.
          It exposes /rerank and /v1/rerank endpoints compatible with the Cohere Rerank API.
          Backed by vLLM with --task score.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: RerankerInferenceServiceSpec defines the desired state of
              a RerankerInferenceService.
            properties:
              maxCandidates:
                default: 100
                description: MaxCandidates caps the number of documents accepted per
                  rerank request.
                format: int32
                maximum: 1000
                minimum: 1
                type: integer
              model:
                description: Model specifies the cross-encoder model weights (e.g.
                  hf://BAAI/bge-reranker-v2-m3).
                properties:
                  hardwareAware:
                    description: |-
                      HardwareAware enables automatic hardware-specific artifact selection.
                      When true, the operator appends hardware suffixes to OCI tags (e.g., -nvidia).
                      Requires ENABLE_EXPERIMENTAL_HARDWARE_SELECTION feature gate.
                    type: boolean
                  name:
                    description: |-
                      Name is the model identifier used in inference requests.
                      This is the value clients use in the "model" field of chat/completion requests.
                    type: string
                  revision:
                    description: |-
                      Revision pins a Hugging Face branch, tag, or commit. It is valid only
                      with hf://, hf-mount://, or hf-mirror:// URIs.
                    type: string
                  storage:
                    description: |-
                      Storage configures credentials for model download.
                      Mirrors LocalModelCache credential support.
                    properties:
                      externalSecret:
                        description: |-
                          ExternalSecret configures native integration with external-secrets.io.
                          When set, the operator creates an ExternalSecret resource to sync
                          credentials from an external provider (Vault, AWS SM, etc.).
                        properties:
                          data:
                            description: Data defines the mapping of remote keys to
                              local secret keys.
                            items:
                              description: ExternalSecretData defines a single mapping
                                of a remote secret to a local key.
                              properties:
                                remoteRef:
                                  description: RemoteRef defines where to fetch the
                                    secret from the provider.
                                  properties:
                                    key:
                                      description: Key is the name/path of the secret
                                        in the external provider.
                                      type: string
                                    property:
                                      description: Property is the specific field
                                        to extract from the remote secret.
                                      type: string
                                  required:
                                  - key
                                  type: object
                                secretKey:
                                  description: SecretKey is the key in the resulting
                                    Kubernetes Secret.
                                  type: string
                              required:
                              - remoteRef
                              - secretKey
                              type: object
                            type: array
                          refreshInterval:
                            default: 1h
                            description: RefreshInterval is how often to re-sync the
                              secret from the provider.
                            type: string
                          secretStoreRef:
                            description: SecretStoreRef references the SecretStore/ClusterSecretStore
                              to use.
                            properties:
                              kind:
                                default: SecretStore
                                description: Kind of the SecretStore (SecretStore
                                  or ClusterSecretStore).
                                type: string
                              name:
                                description: Name of the SecretStore.
                                type: string
                            required:
                            - name
                            type: object
                        required:
                        - secretStoreRef
                        type: object
                      secretRef:
                        description: SecretRef is a reference to a Secret containing
                          storage credentials.
                        properties:
                          name:
                            default: ""
                            description: |-
                              Name of the referent.
                              This field is effectively required, but due to backwards compatibility is
                              allowed to be empty. Instances of this type with an empty value here are
                              almost certainly wrong.
                              More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                            type: string
                        type: object
                        x-kubernetes-map-type: atomic
                      serviceAccountName:
                        description: ServiceAccountName is the name of a ServiceAccount
                          with storage access.
                        type: string
                      storageContainerRef:
                        description: StorageContainerRef references a ClusterStorageContainer
                          for download config.
                        type: string
                      vaultAddr:
                        description: VaultAddr is the address of the HashiCorp Vault
                          server.
                        type: string
                      vaultRef:
                        description: VaultRef is a reference to a Vault path containing
                          storage credentials.
                        type: string
                    type: object
                  uri:
                    description: |-
                      URI is the model artifact location.
                      Supported schemes: hf:// (HuggingFace Hub), hf-mount:// (HuggingFace CSI lazy mount),
                      hf-mirror://, s3://, swfs://, seaweedfs://, gs://, pvc://, oci://, ocis://, modelpack://.
                      hf-mount:// uses the hf-csi-driver to mount repos as a FUSE/NFS filesystem —
                      only accessed bytes are fetched, eliminating full model downloads.
                      `ocis://` is an explicit secure-OCI alias and follows the same runtime
                      verification path as `oci://`, while making the intent visible at the spec boundary.
                    pattern: ^(hf|hf-mount|hf-mirror|s3|swfs|seaweedfs|gs|pvc|oci|ocis|modelpack|https?)://.*$
                    type: string
                required:
                - name
                - uri
                type: object
              quantization:
                description: Quantization configures weight quantization for memory
                  efficiency.
                properties:
                  checkpointPath:
                    description: |-
                      CheckpointPath is retained for API compatibility. vLLM v0.24.0 loads
                      GPTQ metadata from the model and does not accept --gptq-ckpt-path.
                    type: string
                  method:
                    description: |-
                      Method selects the quantization algorithm.
                      "awq" and "gptq" require pre-quantized model weights.
                      "gguf" routes to the quant-cpp engine automatically.
                      "bitsandbytes" and "fp8" quantize at load time.
                    enum:
                    - awq
                    - gptq
                    - gguf
                    - bitsandbytes
                    - fp8
                    type: string
                required:
                - method
                type: object
              replicas:
