apiVersion: v1
kind: Namespace
metadata:
  name: ckodex-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ckodex-controller-manager
  namespace: ckodex-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ckodex-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: manager-role
subjects:
- kind: ServiceAccount
  name: ckodex-controller-manager
  namespace: ckodex-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ckodex-controller-manager
  namespace: ckodex-system
  labels:
    app.kubernetes.io/name: ckodex-kserve-llm-operator
    app.kubernetes.io/component: controller-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ckodex-kserve-llm-operator
      app.kubernetes.io/component: controller-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ckodex-kserve-llm-operator
        app.kubernetes.io/component: controller-manager
    spec:
      serviceAccountName: ckodex-controller-manager
      containers:
      - name: manager
        image: ghcr.io/ckodex-labs/ckodex-kserve-llm:v0.18.0-beta.7
        imagePullPolicy: IfNotPresent
        command:
        - /manager
        args:
        - --leader-elect=false
        - --metrics-bind-address=:8091
        - --health-probe-bind-address=:8087
        ports:
        - containerPort: 8091
          name: metrics
        - containerPort: 8087
          name: health
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
