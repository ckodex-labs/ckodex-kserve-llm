apiVersion: serving.ckodex.com/v1alpha2
kind: Agent
metadata:
  name: document-analyst-agent
  namespace: default
  labels:
    app.kubernetes.io/part-of: ckodex-llm-operator
spec:
  identity:
    name: Document Analyst Agent
    description: Autonomous agent equipped with native UTCP tools for OCR document parsing and image segmentation
    version: 1.0.0

  modelRef: kimi-k31-specimen

  # Native UTCP Manual endpoints for zero-wrapper-overhead tool discovery
  utcpManuals:
    - name: vision-tools
      endpoint: http://utcp-catalog.default.svc.cluster.local/utcp
    - name: ocr-manual
      packRef: aipack-unlimited-ocr-utcp

  # Explicit native UTCP tools
  tools:
    - name: unlimited_ocr_parse
      description: Parse long-horizon documents with Baidu Unlimited-OCR-2
      protocol: utcp
      endpoint: http://unlimited-ocr-2.ckodex-inference.svc.cluster.local:8000/v1/chat/completions
      inputSchema: |
        {
          "type": "object",
          "properties": {
            "document_url": {"type": "string"},
            "pages": {"type": "array", "items": {"type": "integer"}}
          },
          "required": ["document_url"]
        }

    - name: sam3_segment_concept
      description: Perform promptable concept segmentation with Meta SAM 3
      protocol: utcp
      endpoint: http://sam3.ckodex-inference.svc.cluster.local:8000/v1/images/segmentations
      inputSchema: |
        {
          "type": "object",
          "properties": {
            "image_url": {"type": "string"},
            "concept": {"type": "string"}
          },
          "required": ["image_url", "concept"]
        }

  maxTokens: 4096
