apiVersion: serving.kserve.io/v1alpha1
kind: ClusterStorageContainer
metadata:
  name: ckodex-hf-xet-local-model
spec:
  container:
    name: storage-initializer
    image: ghcr.io/ckodex-labs/ckodex-kserve-llm-huggingface-initializer:v0.18.0-rc.7
    imagePullPolicy: IfNotPresent
    env:
      - name: HF_TOKEN
        valueFrom:
          secretKeyRef:
            # This Secret must exist in KServe's localModel.jobNamespace.
            name: hf-secret
            key: HF_TOKEN
            optional: false
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "1"
        memory: 4Gi
  supportedUriFormats:
    - prefix: hf://
  # Keep this scoped to KServe LocalModelCache download Jobs. Omitting the
  # field defaults to initContainer and can conflict with KServe's default
  # hf:// ClusterStorageContainer.
  workloadType: localModelDownloadJob
