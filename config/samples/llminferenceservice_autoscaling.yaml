apiVersion: serving.ckodex.com/v1alpha2
kind: LLMInferenceService
metadata:
  name: llama3-wva-autoscaling
  namespace: ckodex-inference
spec:
  model:
    uri: hf://meta-llama/Llama-3.1-8B-Instruct
    name: meta-llama/Llama-3.1-8B-Instruct
  scaling:
    minReplicas: 1
    maxReplicas: 10
    wva:
      variantCost: "15.0"
    keda:
      pollingInterval: 30
      cooldownPeriod: 300
      initialCooldownPeriod: 120
      idleReplicaCount: 0
      fallback:
        failureThreshold: 3
        replicas: 2
  template:
    spec:
      containers:
      - name: vllm
        image: vllm/vllm-openai:v0.33.0@sha256:d825baf9ce4b1b6bfc5ecc7b79880c7e6748c65a72d697ce3d47607aafa84c6e
        resources:
          limits:
            nvidia.com/gpu: "1"
  router:
    gateway:
      managed: {}
    route:
      httpRoute: {}
    scheduler:
      pool: {}
