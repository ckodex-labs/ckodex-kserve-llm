apiVersion: serving.ckodex.com/v1
kind: LLMInferenceService
metadata:
  name: llama3-8b
  namespace: ckodex-inference
spec:
  model:
    uri: hf://meta-llama/Llama-3.1-8B-Instruct
    name: meta-llama/Llama-3.1-8B-Instruct
  replicas: 2
  template:
    spec:
      containers:
      - name: vllm
        image: vllm/vllm-openai:v0.28.0
        resources:
          limits:
            cpu: "8"
            memory: 32Gi
            # nvidia.com/gpu: "1"  # Uncomment for GPU nodes
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
  router:
    gateway:
      managed:
        gatewayClassName: envoy
    route:
      httpRoute: {}
    scheduler:
      pool: {}
