apiVersion: serving.ckodex.com/v1
kind: LLMInferenceService
metadata:
  name: llama3-8b
  namespace: ckodex-inference
spec:
  model:
    uri: hf://meta-llama/Llama-3.1-8B-Instruct
    name: meta-llama/Llama-3.1-8B-Instruct
  replicas: 2
  template:
    spec:
      containers:
      - name: vllm
        image: vllm/vllm-openai:v0.33.0@sha256:d825baf9ce4b1b6bfc5ecc7b79880c7e6748c65a72d697ce3d47607aafa84c6e
        resources:
          limits:
            cpu: "8"
            memory: 32Gi
            # nvidia.com/gpu: "1"  # Uncomment for GPU nodes
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
  router:
    gateway:
      managed:
        gatewayClassName: envoy
    route:
      httpRoute: {}
    scheduler:
      pool: {}
