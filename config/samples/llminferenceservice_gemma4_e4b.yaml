apiVersion: serving.ckodex.com/v1
kind: LLMInferenceService
metadata:
  name: gemma-4-e4b
  namespace: ckodex-inference
spec:
  model:
    uri: hf://google/gemma-4-E4B-it
    name: google/gemma-4-E4B-it
  replicas: 1
  template:
    spec:
      containers:
      - name: vllm
        resources:
          limits:
            cpu: "16"
            memory: 64Gi
            nvidia.com/gpu: "1"
  router:
    gateway:
      managed:
        gatewayClassName: envoy
    route:
      httpRoute: {}
    scheduler:
      pool: {}
