apiVersion: serving.ckodex.com/v1
kind: LLMInferenceService
metadata:
  name: kimi-k31-specimen
  namespace: default
  labels:
    serving.ckodex.com/model-family: kimi-k3
    serving.ckodex.com/specimen: "true"
spec:
  model:
    name: tiny-random-kimi-k31-pro
    uri: hf://tiny-random/kimi-k3.1-pro
  replicas: 1
  template:
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.33.0@sha256:d825baf9ce4b1b6bfc5ecc7b79880c7e6748c65a72d697ce3d47607aafa84c6e
          imagePullPolicy: IfNotPresent
          args:
            - --trust-remote-code
            - --enforce-eager
            - --gpu-memory-utilization
            - "0.50"
            - --enable-auto-tool-choice
            - --tool-call-parser
            - hermes
            - --max-model-len
            - "8192"
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: 8Gi
              nvidia.com/gpu: "1"
  router:
    gateway:
      managed:
        gatewayClassName: envoy
    route:
      httpRoute: {}
    scheduler:
      pool: {}
