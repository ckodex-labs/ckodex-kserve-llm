{{- if .Values.audit.persistence.enabled -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ckodex-kserve-llm-operator.fullname" . }}-audit
  labels:
    app.kubernetes.io/name: ckodex-kserve-llm-operator
    app.kubernetes.io/component: audit
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  accessModes:
    {{- toYaml .Values.audit.persistence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.audit.persistence.size | quote }}
  {{- if .Values.audit.persistence.storageClass }}
  storageClassName: {{ .Values.audit.persistence.storageClass | quote }}
  {{- end }}
{{- end }}
