{{- if .Values.console.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ckodex-kserve-llm-operator.fullname" . }}-console
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: ckodex-kserve-llm-console
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    component: console
spec:
  type: {{ .Values.console.service.type }}
  ports:
    - name: http
      port: {{ .Values.console.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: ckodex-kserve-llm-console
    app.kubernetes.io/instance: {{ .Release.Name }}
    component: console
{{- end }}
