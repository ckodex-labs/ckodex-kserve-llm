{{- if and .Values.webhook.enabled (not .Values.certManager.enabled) }}
{{- fail "certManager.enabled must be true when webhook.enabled is true; this chart provisions webhook TLS through cert-manager" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ckodex-kserve-llm-operator.fullname" . }}-controller-manager
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: ckodex-kserve-llm-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    control-plane: controller-manager
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      control-plane: controller-manager
  template:
    metadata:
      labels:
        control-plane: controller-manager
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8091"
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "ckodex-kserve-llm-operator.serviceAccountName" . }}
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /manager
          args:
            - --metrics-bind-address={{ .Values.metrics.bindAddress }}
            - --health-probe-bind-address={{ .Values.probes.healthz.bindAddress }}
            - --leader-elect={{ .Values.leaderElection.enabled }}
            {{- if .Values.webhook.enabled }}
            - --webhook-port={{ .Values.webhook.port }}
            {{- end }}
          ports:
            {{- if .Values.webhook.enabled }}
            - containerPort: {{ .Values.webhook.port }}
              name: webhook-server
              protocol: TCP
            {{- end }}
            - containerPort: 8091
              name: metrics
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            # POD_NAMESPACE is used by ImagePullSecretReconciler to locate source pull secrets.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if .Values.proxy.httpProxy }}
            - name: HTTP_PROXY
              value: {{ .Values.proxy.httpProxy | quote }}
            {{- end }}
            {{- if .Values.proxy.httpsProxy }}
            - name: HTTPS_PROXY
              value: {{ .Values.proxy.httpsProxy | quote }}
            {{- end }}
            {{- if .Values.proxy.noProxy }}
            - name: NO_PROXY
              value: {{ .Values.proxy.noProxy | quote }}
            {{- end }}
            {{- if .Values.registry.mirrorURL }}
            - name: CKODEX_HF_MIRROR_URL
              value: {{ .Values.registry.mirrorURL | quote }}
            {{- end }}
            - name: CKODEX_HUGGING_FACE_INITIALIZER_IMAGE
              value: {{ .Values.vllm.huggingFaceInitializerImage | quote }}
            - name: CKODEX_CUSTOM_STORAGE_INITIALIZER_IMAGE
              value: {{ .Values.vllm.customStorageInitializerImage | quote }}
            - name: CKODEX_QUANT_CPP_IMAGE
              value: {{ .Values.vllm.quantCppImage | quote }}
            - name: CKODEX_VLLM_CPU_REQUEST
              value: {{ .Values.vllm.cpuRequest | quote }}
            - name: CKODEX_VLLM_MEMORY_REQUEST
              value: {{ .Values.vllm.memoryRequest | quote }}
            - name: CKODEX_TERMINATION_GRACE_PERIOD_SECONDS
              value: {{ .Values.vllm.terminationGracePeriodSeconds | quote }}
            - name: CKODEX_ASR_CPU_REQUEST
              value: {{ .Values.vllm.asrCPURequest | quote }}
            - name: CKODEX_ASR_MEMORY_REQUEST
              value: {{ .Values.vllm.asrMemoryRequest | quote }}
            - name: CKODEX_ASR_TERMINATION_GRACE_PERIOD_SECONDS
              value: {{ .Values.vllm.asrTerminationGracePeriodSeconds | quote }}
            - name: CKODEX_CACHE_CPU_REQUEST
              value: {{ .Values.vllm.cacheCPURequest | quote }}
            - name: CKODEX_CACHE_MEMORY_REQUEST
              value: {{ .Values.vllm.cacheMemoryRequest | quote }}
            # Feature Gates
            - name: CKODEX_FEATURE_ENABLE_SECURITY
              value: {{ .Values.features.enableSecurity | quote }}
            - name: CKODEX_FEATURE_ENABLE_WEBHOOKS
              value: {{ .Values.webhook.enabled | quote }}
            - name: CKODEX_FEATURE_ENABLE_AUTOSCALER
              value: {{ .Values.features.enableAutoscaler | quote }}
            - name: CKODEX_FEATURE_ENABLE_GATEWAY
              value: {{ .Values.features.enableGateway | quote }}
            - name: CKODEX_FEATURE_ENABLE_SCHEDULER
              value: {{ .Values.features.enableScheduler | quote }}
            - name: CKODEX_FEATURE_ENABLE_EXPERIMENTAL_AGENTS
              value: {{ .Values.features.enableExperimentalAgents | quote }}
            - name: CKODEX_FEATURE_ENABLE_EXPERIMENTAL_HARDWARE_SELECTION
              value: {{ .Values.features.enableExperimentalHardwareSelection | quote }}
            - name: CKODEX_FEATURE_ENABLE_EXPERIMENTAL_STATUS_HARDENING
              value: {{ .Values.features.enableExperimentalStatusHardening | quote }}
            - name: CKODEX_RUNTIME_IMAGE
              value: {{ .Values.vllm.defaultImage | quote }}
            - name: CKODEX_ENVOY_GATEWAY_NAMESPACE
              value: {{ .Values.gateway.dataPlaneNamespace | quote }}
          resources: {{ toYaml .Values.controller.resources | nindent 12 }}
          securityContext: {{ toYaml .Values.controller.securityContext | nindent 12 }}
          {{- if .Values.webhook.enabled }}
          volumeMounts:
            - mountPath: {{ .Values.webhook.certDir }}
              name: cert
              readOnly: true
          {{- end }}
      {{- if .Values.webhook.enabled }}
      volumes:
        - name: cert
          secret:
            defaultMode: 420
            secretName: {{ include "ckodex-kserve-llm-operator.fullname" . }}-webhook-cert
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
