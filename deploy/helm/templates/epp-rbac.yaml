{{- if .Values.rbac.create }}
{{- range .Values.managedNamespaces }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ckodex-epp
  namespace: {{ . }}
  labels:
    app.kubernetes.io/name: ckodex-epp
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    serving.ckodex.com/epp-rbac: preprovisioned
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ckodex-epp
  namespace: {{ . }}
  labels:
    app.kubernetes.io/name: ckodex-epp
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    serving.ckodex.com/epp-rbac: preprovisioned
rules:
- apiGroups: [""]
  resources: [pods]
  verbs: [get, list, watch]
- apiGroups: [inference.networking.k8s.io]
  resources: [inferencepools]
  verbs: [get, list, watch]
- apiGroups: [inference.networking.x-k8s.io]
  resources: [inferencemodelrewrites, inferenceobjectives]
  verbs: [get, list, watch]
- apiGroups: [llm-d.ai]
  resources: [inferencemodelrewrites, inferenceobjectives]
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ckodex-epp
  namespace: {{ . }}
  labels:
    app.kubernetes.io/name: ckodex-epp
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    serving.ckodex.com/epp-rbac: preprovisioned
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ckodex-epp
subjects:
- kind: ServiceAccount
  name: ckodex-epp
  namespace: {{ . }}
{{- end }}
{{- end }}
