{{- if .Values.rbac.create -}}
---
# ClusterRoleBinding for cluster-scoped access (nodes, CRDs, LocalModelCache, Gatekeeper).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ckodex-kserve-llm-operator.fullname" . }}-cluster-rolebinding
  labels:
    app.kubernetes.io/name: ckodex-kserve-llm-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ckodex-operator-cluster-role
subjects:
- kind: ServiceAccount
  name: {{ include "ckodex-kserve-llm-operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}

{{- /*
  Namespace-scoped RoleBindings: one per managed namespace.
  Add namespaces to .Values.managedNamespaces in values.yaml.
  The operator SA gets ckodex-operator-namespace-role in each listed namespace.
*/}}
{{- range .Values.managedNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ckodex-kserve-llm-operator.fullname" $ }}-namespace-rolebinding
  namespace: {{ . }}
  labels:
    app.kubernetes.io/name: ckodex-kserve-llm-operator
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    ckodex.com/managed-namespace: "true"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ckodex-operator-namespace-role
subjects:
- kind: ServiceAccount
  name: {{ include "ckodex-kserve-llm-operator.serviceAccountName" $ }}
  namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
