{{- if .Values.rbac.create -}}
---
# ClusterRole granting the operator the permissions it needs across all namespaces.
# Rules mirror config/rbac/role.yaml (generated by controller-gen from +kubebuilder:rbac markers).
# Update this section whenever `make manifests` regenerates config/rbac/role.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ckodex-operator-cluster-role
  labels:
    app.kubernetes.io/name: ckodex-kserve-llm-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
rules:
- apiGroups: [""]
  resources: [configmaps]
  verbs: [create, delete, get, list, patch, update, watch]
- apiGroups: [""]
  resources: [namespaces, nodes]
  verbs: [get, list, watch]
- apiGroups: [""]
  resources: [events, secrets]
  verbs: [create, get, list, patch, update, watch]
- apiGroups: [""]
  resources: [limitranges, persistentvolumeclaims, persistentvolumes, pods, resourcequotas, services]
  verbs: [create, delete, get, list, patch, update, watch]
- apiGroups: [""]
  resources: [serviceaccounts]
  verbs: [get, list, patch, update, watch]
- apiGroups: [apps]
  resources: [deployments]
  verbs: [create, delete, get, list, patch, update, watch]
- apiGroups: [autoscaling]
  resources: [horizontalpodautoscalers]
  verbs: [create, delete, get, list, patch, update, watch]
- apiGroups: [batch]
  resources: [jobs]
  verbs: [create, delete, get, list, patch, update, watch]
- apiGroups: [discovery.k8s.io]
  resources: [endpointslices]
  verbs: [get, list, watch]
- apiGroups: [gateway.networking.k8s.io]
  resources: [gateways, grpcroutes, httproutes]
  verbs: [create, delete, get, list, patch, update, watch]
- apiGroups: [networking.k8s.io]
  resources: [networkpolicies]
  verbs: [create, delete, get, list, patch, update, watch]
- apiGroups: [policy]
  resources: [poddisruptionbudgets]
  verbs: [create, delete, get, list, patch, update, watch]
- apiGroups: [inference.networking.k8s.io]
  resources: [inferencepools]
  verbs: [create, delete, get, list, patch, update, watch]
- apiGroups: [inference.networking.x-k8s.io]
  resources: [inferencemodelrewrites, inferenceobjectives]
  verbs: [get, list, watch]
- apiGroups: [llm-d.ai]
  resources: [inferencemodelrewrites, inferenceobjectives]
  verbs: [get, list, watch]
- apiGroups: [serving.ckodex.com]
  resources:
    - agents
    - asrinferenceservices
    - coactorgroups
    - embeddinginferenceservices
    - inferenceactors
    - inferencesessions
    - llminferenceservices
    - llmloraadapters
    - localmodelcaches
    - modelonboardings
    - multimodalinferenceservices
    - rerankerinferenceservices
    - skillregistries
  verbs: [create, delete, get, list, patch, update, watch]
- apiGroups: [serving.ckodex.com]
  resources: [aipacks]
  verbs: [get, list, patch, update, watch]
- apiGroups: [serving.ckodex.com]
  resources:
    - agents/finalizers
    - asrinferenceservices/finalizers
    - embeddinginferenceservices/finalizers
    - llminferenceservices/finalizers
    - modelonboardings/finalizers
    - multimodalinferenceservices/finalizers
    - rerankerinferenceservices/finalizers
    - skillregistries/finalizers
  verbs: [update]
- apiGroups: [serving.ckodex.com]
  resources:
    - agents/status
    - aipacks/status
    - asrinferenceservices/status
    - coactorgroups/status
    - embeddinginferenceservices/status
    - inferenceactors/status
    - inferencesessions/status
    - llminferenceservices/status
    - llmloraadapters/status
    - localmodelcaches/status
    - modelonboardings/status
    - multimodalinferenceservices/status
    - rerankerinferenceservices/status
    - skillregistries/status
  verbs: [get, patch, update]
---
# ClusterRoleBinding for cluster-scoped access (nodes, CRDs, LocalModelCache, Gatekeeper).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ckodex-kserve-llm-operator.fullname" . }}-cluster-rolebinding
  labels:
    app.kubernetes.io/name: ckodex-kserve-llm-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ckodex-operator-cluster-role
subjects:
- kind: ServiceAccount
  name: {{ include "ckodex-kserve-llm-operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
---
# Leader election is namespace-scoped and intentionally separate from the
# operator's workload permissions.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ckodex-kserve-llm-operator.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: ckodex-kserve-llm-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
rules:
- apiGroups: [coordination.k8s.io]
  resources: [leases]
  verbs: [create, get, list, patch, update, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ckodex-kserve-llm-operator.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: ckodex-kserve-llm-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ckodex-kserve-llm-operator.fullname" . }}-leader-election
subjects:
- kind: ServiceAccount
  name: {{ include "ckodex-kserve-llm-operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}

{{- /*
  Namespace-scoped RoleBindings: one per managed namespace.
  Add namespaces to .Values.managedNamespaces in values.yaml.
  The operator SA gets ckodex-operator-namespace-role in each listed namespace.
*/}}
{{- range .Values.managedNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ckodex-kserve-llm-operator.fullname" $ }}-namespace-rolebinding
  namespace: {{ . }}
  labels:
    app.kubernetes.io/name: ckodex-kserve-llm-operator
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    ckodex.com/managed-namespace: "true"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ckodex-operator-namespace-role
subjects:
- kind: ServiceAccount
  name: {{ include "ckodex-kserve-llm-operator.serviceAccountName" $ }}
  namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
