# CKodex KServe LLM Operator Helm Values
# replicaCount: 2 ensures one replica survives node drain/eviction while the other reconciles.
# Requires leaderElection.enabled=true (already the default) so only the leader reconciles.
replicaCount: 2

image:
  repository: ghcr.io/ckodex/kserve-llm-operator
  tag: "0.17.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: true

controller:
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  securityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true

webhook:
  port: 9443
  certDir: /tmp/k8s-webhook-server/serving-certs

# cert-manager integration — provisions TLS certificates for the webhook server.
# Requires cert-manager v1.14+ installed in the cluster before enabling.
# When enabled: Helm creates Certificate, Issuer, and webhook configurations.
#               cert-manager cainjector automatically populates caBundle fields.
# When disabled: the Deployment still mounts a cert volume but no Certificate CR is created.
#               Set CKODEX_FEATURE_ENABLE_WEBHOOKS=false (default) to disable webhooks entirely.
certManager:
  enabled: false
  # issuerRef: reference an existing Issuer or ClusterIssuer.
  # When name is empty a self-signed ClusterIssuer + intermediate CA are created automatically.
  # For production use a trusted PKI: Vault, AWS ACM-PCA, Let's Encrypt, etc.
  issuerRef:
    name: ""
    kind: ClusterIssuer

metrics:
  enabled: true
  bindAddress: ":8091"
  serviceMonitor:
    enabled: false  # opt-in — requires prometheus-operator CRDs installed
    interval: "30s"

probes:
  healthz:
    bindAddress: ":8081"

leaderElection:
  enabled: true
  id: "ckodex-kserve-llm.ckodex.com"

# Default vLLM settings
# Images are pinned to digests for reproducibility and supply chain security.
# Update digests by running: crane digest <image>:<tag>
# Verify signatures: cosign verify <image>@<digest> --certificate-oidc-issuer=https://token.actions.githubusercontent.com
vllm:
  # vLLM v0.24.0 is the verified CUDA default.
  defaultImage: "vllm/vllm-openai:v0.24.0"
  gemma4Image: "vllm/vllm-openai:gemma4"
  cpuImage: "vllm/vllm-openai-cpu:v0.24.0"
  # vLLM does not publish v0.24.0-rocm in vllm/vllm-openai.
  # Set this to a cluster-validated ROCm image before enabling AMD selection.
  rocmImage: ""
  storageInitializerImage: "kserve/storage-initializer:v0.19.0"

  # v0.19.0 features
  cpuKvOffloading:
    enabled: false     # general CPU KV cache offloading
  dbo:
    enabled: false     # Dual-Batch Overlap for throughput

# HuggingFace CSI Driver integration
# Install prerequisite: helm install hf-csi oci://ghcr.io/huggingface/charts/hf-csi-driver --version 0.11.1 -n kube-system
# The operator manages static PV+PVC provisioning for hf-mount:// URIs using this driver.
hfCsiDriver:
  enabled: true
  driverName: "hf.csi.huggingface.co"

# Gemma 4 Model Profiles
# Pre-configured resource profiles for each model variant.
gemma4:
  e2b:
    enabled: true
    resources:
      requests: { cpu: "4", memory: "16Gi", nvidia.com/gpu: "1" }
      limits:   { cpu: "8", memory: "32Gi", nvidia.com/gpu: "1" }
  e4b:
    enabled: false
    resources:
      requests: { cpu: "8", memory: "32Gi", nvidia.com/gpu: "1" }
      limits:   { cpu: "16", memory: "64Gi", nvidia.com/gpu: "1" }
  "26b-a4b":
    enabled: false
    moe: true          # Mixture-of-Experts flag
    resources:
      requests: { cpu: "16", memory: "64Gi", nvidia.com/gpu: "1" }
      limits:   { cpu: "32", memory: "128Gi", nvidia.com/gpu: "1" }
  "31b":
    enabled: false
    tensorParallel: 2
    resources:
      requests: { cpu: "16", memory: "128Gi", nvidia.com/gpu: "2" }
      limits:   { cpu: "32", memory: "256Gi", nvidia.com/gpu: "2" }

# EPP Scheduler defaults
scheduler:
  image: "ghcr.io/llm-d/llm-d-router-endpoint-picker:v0.9.0"
  replicas: 1
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

# SPIRE configuration
spire:
  enabled: false
  server:
    image: "ghcr.io/spiffe/spire-server:1.15.1"
    replicas: 1
  agent:
    image: "ghcr.io/spiffe/spire-agent:1.15.1"
  trustDomain: "ckodex.com"

# Gateway API
gateway:
  className: "envoy"

# Resilience defaults
resilience:
  circuitBreaker:
    failureThreshold: 5
    successThreshold: 3
    timeoutSeconds: 30
  retry:
    maxRetries: 3
    baseBackoffMs: 100
  bulkhead:
    maxConcurrent: 100
  timeoutCascade:
    clientSeconds: 30
    gatewaySeconds: 25
    inferenceSeconds: 20

# Observability
observability:
  otel:
    enabled: true
    endpoint: ""
  logging:
    level: info
    format: json

# Feature Gates
# Controls which subsystems and experimental features are enabled.
features:
  # enableSecurity enables SPIFFE/SPIRE, eBPF, OPA, and Vault integration.
  enableSecurity: false
  # enableAutoscaler enables HPA/KEDA/WVA autoscaling.
  enableAutoscaler: true
  # enableGateway enables Gateway API resource management.
  enableGateway: true
  # enableScheduler enables the EPP scheduler.
  enableScheduler: true
  # enableExperimentalAgents enables the Agent and SkillRegistry controllers (M3).
  enableExperimentalAgents: false
  # enableExperimentalHardwareSelection enables hardware-specific image tag selection.
  enableExperimentalHardwareSelection: false
  # enableExperimentalStatusHardening enables the new DeploymentReady status check.
  enableExperimentalStatusHardening: false

# Chaos engine
chaos:
  enabled: false

# Network policies
networkPolicies:
  enabled: true

# managedNamespaces lists the namespaces where the operator SA is granted
# ckodex-operator-namespace-role (namespace-scoped RBAC).
# The operator will reconcile LLMInferenceService, Deployments, Services, etc.
# only in namespaces listed here. Add a namespace here AND label it with
# ckodex.com/tenant-id=<id> to activate per-tenant quota enforcement.
# Example:
#   managedNamespaces:
#     - team-a
#     - team-b
managedNamespaces: []

# Air-gap and private registry support.
# When mirrorURL is set, the operator rewrites hf:// model URIs to hf-mirror:// at admission
# time so the storage initializer fetches from your internal HuggingFace Hub proxy instead of
# the public huggingface.co. The operator itself also uses mirrorURL for all HF API calls.
# mirrorURL must include scheme: e.g. "https://hf-mirror.corp.internal"
registry:
  mirrorURL: ""

# Outbound HTTP/HTTPS proxy for storage client and OIDC provider requests.
# Mirrors the standard Go proxy env vars; set these when the operator runs in an environment
# that requires a forward proxy to reach the internet (HuggingFace Hub, ECR, OCI registries).
proxy:
  # httpProxy: "http://proxy.corp.internal:3128"
  # httpsProxy: "http://proxy.corp.internal:3128"
  # noProxy: "localhost,127.0.0.1,.corp.internal"
  httpProxy: ""
  httpsProxy: ""
  noProxy: ""

nodeSelector: {}
tolerations: []
affinity: {}
