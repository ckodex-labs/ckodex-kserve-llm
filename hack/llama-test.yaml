apiVersion: serving.ckodex.com/v1alpha2
kind: LLMInferenceService
metadata:
  name: "llama3-8b"
  namespace: "default"
spec:
  model:
    uri: "hf://Qwen/Qwen2.5-0.5B-Instruct"
    name: "qwen-0.5b"
  replicas: 1
  template:
    spec:
      containers:
      - name: vllm
        image: vllm/vllm-openai:latest-aarch64
        securityContext:
          runAsUser: 1000
          runAsNonRoot: true
        env:
        - name: VLLM_TARGET_DEVICE
          value: "cpu"
        - name: HUGGING_FACE_HUB_TOKEN
          value: "dummy"
        resources:
          requests:
            cpu: "1"
            memory: "2Gi"
          limits:
            cpu: "4"
            memory: "8Gi"
  router:
    gateway:
      managed:
        gatewayClassName: envoy
    route:
      httpRoute: {}
    scheduler:
      pool: {}
  scaling:
    minReplicas: 1
    maxReplicas: 2
    keda: {}
