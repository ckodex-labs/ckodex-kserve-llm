# Enables the Gateway API Inference Extension InferencePool backend contract.
#
# Source contract: Envoy AI Gateway's InferencePool addon values:
# https://github.com/envoyproxy/ai-gateway/blob/v1.1.0/examples/inference-pool/envoy-gateway-values-addon.yaml
# The values are kept in-repository so the local profile has a reviewable,
# reproducible configuration rather than fetching a moving branch at runtime.
config:
  envoyGateway:
    gateway:
      controllerName: gateway.envoyproxy.io/gatewayclass-controller
    provider:
      type: Kubernetes
    extensionApis:
      enableBackend: true
      enableEnvoyPatchPolicy: true
    # These hooks are the AI Gateway extension-manager contract. The service
    # name and port match the pinned ai-gateway chart installed by 02-prereqs.
    extensionManager:
      backendResources:
      - group: inference.networking.k8s.io
        kind: InferencePool
        version: v1
      hooks:
        xdsTranslator:
          translation:
            listener:
              includeAll: true
            route:
              includeAll: true
            cluster:
              includeAll: true
            secret:
              includeAll: true
          post:
          - Translation
          - Cluster
          - Route
          - Secret
      service:
        fqdn:
          hostname: ai-gateway-controller.envoy-ai-gateway-system.svc.cluster.local
          port: 1063
