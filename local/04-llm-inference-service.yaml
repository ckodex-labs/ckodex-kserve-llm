apiVersion: serving.ckodex.com/v1
kind: LLMInferenceService
metadata:
  name: llama3-8b
  namespace: default
spec:
  model:
    name: gpt2
    # The default beta proof uses the signed hf:// storage initializer.
    # hf-mount:// is an optional CSI/FUSE profile; see local/04-llm-inference-service-hfmount.yaml.
    uri: hf://openai-community/gpt2
  template:
    spec:
      containers:
      - name: vllm
        args:
        - --enforce-eager
        - --max-model-len
        - "1024"
        # Keep the smoke profile within its 8 GiB memory limit after model
        # weights and runtime overhead; production profiles must size this
        # value for their model and node memory budget.
        env:
        - name: VLLM_CPU_KVCACHE_SPACE
          value: "1"
        - name: VLLM_CPU_OMP_THREADS_BIND
          value: "0-2"
        - name: OMP_NUM_THREADS
          value: "3"
        resources:
          limits:
            cpu: "4"
            memory: "8Gi"
          requests:
            cpu: "1"
            memory: "2Gi"
  scaling:
    minReplicas: 1
    maxReplicas: 3
  router:
    gateway:
      managed:
        gatewayClassName: envoy
    route:
      httpRoute:
        hostnames:
        - llama3-8b.ckodex.com
    scheduler:
      pool:
        selector:
          app.kubernetes.io/instance: llama3-8b
      replicas: 1
