apiVersion: v1
kind: Namespace
metadata:
  name: storage
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: storage
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/instance: local
spec:
  ports:
  - port: 9333
    targetPort: 9333
    name: master
  - port: 8888
    targetPort: 8888
    name: filer
  - port: 8333
    targetPort: 8333
    name: s3
  selector:
    app: seaweedfs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: storage
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/instance: local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      containers:
      - name: master
        image: chrislusf/seaweedfs:4.37
        command: ["sh", "-c", "mkdir -p /data/master && weed master -ip=localhost -mdir=/data/master"]
        ports:
        - containerPort: 9333
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: data
          mountPath: /data
      - name: volume
        image: chrislusf/seaweedfs:4.37
        command: ["sh", "-c", "mkdir -p /data/volume && weed volume -mserver=localhost:9333 -port=8080 -dir=/data/volume"]
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
        volumeMounts:
        - name: data
          mountPath: /data
      - name: filer
        image: chrislusf/seaweedfs:4.37
        command: ["sh", "-c", "mkdir -p /data/filer && weed filer -master=localhost:9333 -s3 -s3.iam=false -s3.port=8333"]
        ports:
        - containerPort: 8888
        - containerPort: 8333
        readinessProbe:
          httpGet:
            path: /
            port: 8888
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        emptyDir: {}
