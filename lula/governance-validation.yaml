metadata:
  name: validate-audit-governance
  uuid: 0EE4FFB8-8B8C-43D5-9ADE-7AF5BD8DCF1A
domain:
  type: kubernetes
  kubernetes-spec:
    resources:
      - name: llmServices
        resource-rule:
          group: serving.ckodex.com
          version: v1alpha2
          resource: llminferenceservices
          namespaces: []
provider:
  type: opa
  opa-spec:
    rego: |
      package validate
      import rego.v1

      default validate := false

      validate if {
        count(input.llmServices) > 0
        every service in input.llmServices {
          some condition in service.status.conditions
          condition.type == "Compliance-AU-2"
          condition.status == "True"
          condition.reason == "AuditPersistent"
        }
      }

      service_count := count(input.llmServices)
    output:
      validation: validate.validate
      observations:
        - validate.service_count
