component-definition:
  uuid: c67ec05a-500b-4171-a068-9a2f643da81a
  metadata:
    title: KServe LLM Operator - Hardened v1.0.0
    last-modified: 2026-04-08T14:14:00Z
    version: 1.0.0
    oscal-version: 1.1.2
    parties:
      - uuid: 11111111-1111-4111-8111-111111111111
        type: organization
        name: CKodex Labs
  components:
    - uuid: 22222222-2222-4222-8222-222222222222
      type: software
      title: kserve-llm-operator
      description: Hardened KServe LLM Operator with Zero-Trust enforcement
      purpose: Serve LLMs securely on Kubernetes
      responsible-roles:
        - role-id: provider
          party-uuids:
            - 11111111-1111-4111-8111-111111111111
      control-implementations:
        - uuid: 33333333-3333-4333-8333-333333333333
          source: https://github.com/defenseunicorns/lula
          description: NIST 800-53 security controls for containerized inference
          implemented-requirements:
            - uuid: 44444444-4444-4444-8444-444444444445
              control-id: ac-4
              description: Ensure information flow enforcement via NetworkPolicies
              links:
                - rel: lula
                  href: file:./network-policy-validation.yaml
            - uuid: 44444444-4444-4444-8444-444444444446
              control-id: au-2
              description: Ensure audit events are captured and persistent
              links:
                - rel: lula
                  href: file:./governance-validation.yaml
            - uuid: 44444444-4444-4444-8444-444444444447
              control-id: si-7
              description: >-
                Ensure software and information integrity via cosign signature
                verification, SLSA provenance attestation, and CycloneDX SBOM
                presence on all LLMInferenceService workloads.
              links:
                - rel: lula
                  href: file:./supply-chain-validation.yaml
              set-parameters:
                - param-id: si-7_prm_1
                  values:
                    - "cosign signature + SLSA provenance + CycloneDX SBOM"
              statements:
                - statement-id: si-7_smt
                  uuid: 55555555-5555-4555-8555-555555555551
                  description: >-
                    The operator records cryptographic verification results as
                    Kubernetes status conditions (Compliance-SI-7). Lula validates
                    that this condition is True and has reason ProvenanceVerified
                    on all LLMInferenceService resources cluster-wide.
                  by-components:
                    - component-uuid: 22222222-2222-4222-8222-222222222222
                      uuid: 55555555-5555-4555-8555-555555555552
                      description: >-
                        kserve-llm-operator reconciles Compliance-SI-7 condition
                        when the supply-chain verification record is present.
                      implementation-status:
                        state: implemented
                      satisfied: true
            - uuid: 44444444-4444-4444-8444-444444444448
              control-id: si-4
              description: Information system monitoring via Open Inference Signals (OIS)
              links:
                - rel: lula
                  href: file:./ois-validation.yaml
            - uuid: 44444444-4444-4444-8444-444444444449
              control-id: sr-2
              description: Supply chain risk management via SLSA provenance
              links:
                - rel: lula
                  href: file:./supply-chain-validation.yaml
