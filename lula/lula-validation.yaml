lula-validation:
  uuid: 66666666-6666-6666-6666-666666666666
  attributes:
    provider: kubernetes
    domain: pods
  payload:
    resources:
      - name: demo-vllm
        resource: deployments
    regos:
      - |
        package lula

        validate {
          # Check all containers in the deployment for runAsNonRoot
          all([c.securityContext.runAsNonRoot | c := input.spec.template.spec.containers[_]])
          all([c.securityContext.runAsNonRoot | c := input.spec.template.spec.initContainers[_]])
        }
