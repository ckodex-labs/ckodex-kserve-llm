apiVersion: lula.dev/v1alpha1
kind: Validation
metadata:
  name: lula-network-policy-enforcement
  labels:
    oscal-control: ac-4
spec:
  description: "Ensure that LLMInferenceService deployments have associated NetworkPolicies"
  domain:
    type: kubernetes
    kubernetesSpec:
      resources:
        - name: networkpolicies
          resource: networkpolicies
          allNamespaces: true
  payload:
    rego: |
      package lula

      # Check that at least one NetworkPolicy exists in the same namespace as each LLMInferenceService.
      # In a real environment, we would join across resources, but for this validation 
      # we simplified to checking that NetworkPolicies are present.
      validate {
        count(input.resources) > 0
      }
