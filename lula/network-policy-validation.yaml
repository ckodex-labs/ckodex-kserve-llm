metadata:
  name: validate-network-policy-enforcement
  uuid: CBCAB505-D5C0-4D6E-80FC-A9E1B893964F
domain:
  type: kubernetes
  kubernetes-spec:
    resources:
      - name: llmServices
        resource-rule:
          group: serving.ckodex.com
          version: v1alpha2
          resource: llminferenceservices
          namespaces: []
      - name: networkPolicies
        resource-rule:
          group: networking.k8s.io
          version: v1
          resource: networkpolicies
          namespaces: []
provider:
  type: opa
  opa-spec:
    rego: |
      package validate
      import rego.v1

      default validate := false

      validate if {
        count(input.llmServices) > 0
        every service in input.llmServices {
          some policy in input.networkPolicies
          policy.metadata.namespace == service.metadata.namespace
        }
      }

      service_count := count(input.llmServices)
      network_policy_count := count(input.networkPolicies)
    output:
      validation: validate.validate
      observations:
        - validate.service_count
        - validate.network_policy_count
