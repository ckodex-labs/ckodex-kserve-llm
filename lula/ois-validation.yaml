metadata:
  name: validate-ois-monitoring
  uuid: 2F2AF80D-7E28-49BE-BCCE-06F90D4C0D47
domain:
  type: kubernetes
  kubernetes-spec:
    resources:
      - name: llmServices
        resource-rule:
          group: serving.ckodex.com
          version: v1alpha2
          resource: llminferenceservices
          namespaces: []
provider:
  type: opa
  opa-spec:
    rego: |
      package validate
      import rego.v1

      default validate := false

      validate if {
        count(input.llmServices) > 0
        every service in input.llmServices {
          some condition in service.status.conditions
          condition.type == "Compliance-SI-4"
          condition.status == "True"
          condition.reason == "OISSignalsActive"
        }
      }

      service_count := count(input.llmServices)
    output:
      validation: validate.validate
      observations:
        - validate.service_count
