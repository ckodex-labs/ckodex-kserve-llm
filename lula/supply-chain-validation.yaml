metadata:
  name: validate-supply-chain-evidence
  uuid: 73764513-F2FC-4063-A481-E70439958C64
domain:
  type: kubernetes
  kubernetes-spec:
    resources:
      - name: llmServices
        resource-rule:
          group: serving.ckodex.com
          version: v1alpha2
          resource: llminferenceservices
          namespaces: []
provider:
  type: opa
  opa-spec:
    rego: |
      package validate
      import rego.v1

      default validate := false

      validate if {
        count(input.llmServices) > 0
        every service in input.llmServices {
          has_condition(service, "Compliance-SI-7", "IntegrityVerified")
          has_condition(service, "Compliance-SR-2", "ProvenanceVerified")
        }
      }

      has_condition(service, condition_type, reason) if {
        some condition in service.status.conditions
        condition.type == condition_type
        condition.status == "True"
        condition.reason == reason
      }

      service_count := count(input.llmServices)
    output:
      validation: validate.validate
      observations:
        - validate.service_count
