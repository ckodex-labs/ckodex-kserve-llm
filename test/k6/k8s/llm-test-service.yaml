apiVersion: serving.ckodex.com/v1alpha2
kind: LLMInferenceService
metadata:
  name: k6-llm-test
  namespace: ckodex-inference
  labels:
    app.kubernetes.io/part-of: ckodex-llm-operator
    test.ckodex.com/suite: k6
spec:
  model:
    name: gpt2
    uri: hf://openai-community/gpt2
  replicas: 1
  template:
    spec:
      containers:
      - name: vllm
        image: vllm/vllm-openai-cpu:v0.33.0@sha256:87167cf0ec6e1e9607bb1cf9bf618a67d04963236a34bd955ac75b7d31a6edf5
        resources:
          requests:
            cpu: "2"
            memory: 4Gi
          limits:
            cpu: "2"
            memory: 4Gi
        ports:
        - containerPort: 8000
